<title>012 · Murmuration — StanVision Lab</title>
<meta name="description" content="A particle pattern builder. Compose flocks from a drifting cloud band and draggable ribbon strokes, render them as dithered pixels, rounded dots or bars, then trigger sweeps, bursts, reveals and morphs. Brand colourways, PNG export, embed API. A StanVision Lab experiment.">

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes; uniform float uTime;
uniform int uTex, uDither, uBase;
uniform float uCell, uDot, uSizeBy, uBarW, uBarRows, uBarJit;
uniform float uGain, uGamma, uJitter, uZoom;
uniform vec3 uBg, uFg;
uniform float uAngle, uBandW, uBandOff, uGrain, uNScale, uNDetail, uNStretch, uNoiseT;
uniform vec2 uFlow;
uniform vec4 uStA[3], uStB[3]; uniform float uStW[3], uStOn[3];
uniform float uCore, uCoreW, uTaper, uFanW, uFanAmt, uFanScale, uEndFade;
uniform vec2 uMouse; uniform float uMouseR, uMouseAmt;
uniform float uSweep, uSweepAmt, uSweepW, uReveal, uRevealSoft, uBurst, uCollapse;
uniform vec2 uHole; uniform float uHoleR;

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3. - 2. * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0., a = .5; mat2 r = mat2(.8, .6, -.6, .8);
  for (int i = 0; i < 6; i++){ if (float(i) >= uNDetail) break; v += a * vnoise(p); p = r * p * 2.03 + 11.7; a *= .5; }
  return v / (1. - a);
}
float bayer2(vec2 a){ a = floor(a); return fract(a.x / 2. + a.y * a.y * .75); }
float bayer4(vec2 a){ return bayer2(.5 * a) * .25 + bayer2(a); }
float bayer8(vec2 a){ return bayer4(.5 * a) * .25 + bayer2(a); }
float ign(vec2 p){ return fract(52.9829189 * fract(dot(p, vec2(.06711056, .00583715)))); }

vec2 bez(vec2 a, vec2 b, vec2 c, vec2 d, float t){ float s = 1. - t; return s*s*s*a + 3.*s*s*t*b + 3.*s*t*t*c + t*t*t*d; }
void strokeDist(vec2 q, vec2 a, vec2 b, vec2 c, vec2 d, out float md, out float mt){
  md = 1e9; mt = 0.; vec2 prev = a;
  for (int i = 1; i <= 28; i++){
    float t = float(i) / 28.; vec2 p = bez(a, b, c, d, t);
    vec2 pa = q - prev, ba = p - prev; float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0., 1.);
    float dd = length(pa - ba * h);
    if (dd < md){ md = dd; mt = (float(i - 1) + h) / 28.; }
    prev = p;
  }
}

/* screen px -> field coords (x in ±aspect/2, y in ±.5, y up) */
vec2 toField(vec2 px){ return ((px / uRes) - .5) * vec2(uRes.x / uRes.y, 1.) / uZoom; }

float field(vec2 q, vec2 cellId){
  float aspect = uRes.x / uRes.y;
  float v = 0.;
  vec2 dir = vec2(cos(uAngle), sin(uAngle)), nrm = vec2(-dir.y, dir.x);
  float along = dot(q, dir), across = dot(q, nrm);
  float proj = along / (aspect * .5 + .5);   /* roughly -1..1 across the frame */

  /* base cloud */
  if (uBase == 1){
    float band = exp(-pow((across - uBandOff) / max(uBandW, .001), 2.));
    vec2 np = vec2(along, across * uNStretch) * uNScale + uFlow;
    float n = fbm(np + uNoiseT);
    n = smoothstep(.28, .78, n);
    v = band * mix(1., n * 1.4, uGrain);
  } else if (uBase == 2){
    vec2 np = q * uNScale + uFlow;
    float n = fbm(np + uNoiseT);
    v = smoothstep(.3, .8, n) * 1.2;
  }

  /* ribbon strokes */
  for (int i = 0; i < 3; i++){
    if (uStOn[i] < .5) continue;
    float d, t; strokeDist(q, uStA[i].xy, uStA[i].zw, uStB[i].xy, uStB[i].zw, d, t);
    float w = uStW[i] * (1. + uTaper * pow(abs(t - .5) * 2., 2.));
    float ends = smoothstep(0., uEndFade, t) * smoothstep(1., 1. - uEndFade, t);
    float body = exp(-pow(d / w, 2.));
    float core = exp(-pow(d / (w * uCoreW), 2.)) * uCore;
    float nf = fbm((q + vec2(t * 3.1, float(i) * 7.))* uFanScale + uFlow * .5 + uNoiseT);
    float fan = exp(-pow(d / (w * uFanW), 2.)) * smoothstep(.3, .8, nf) * uFanAmt;
    v = max(v, (body + core + fan) * ends);
  }

  /* sweep: a travelling flock band */
  if (uSweepAmt > 0.){
    float sw = exp(-pow((proj - uSweep) / uSweepW, 2.));
    float n2 = smoothstep(.25, .8, fbm(q * 5. + uNoiseT * 2. + 3.));
    v += sw * uSweepAmt * (.35 + .65 * n2);
  }

  /* cursor */
  if (uMouseAmt != 0.){
    float dm = length(q - uMouse);
    v += uMouseAmt * exp(-pow(dm / uMouseR, 2.));
  }
  /* collapse: everything is pulled into one spot */
  if (uCollapse > 0.){
    float dh = length(q - uHole);
    v = mix(v, exp(-pow(dh / uHoleR, 2.)) * 2.4 * smoothstep(.2, .8, fbm(q * 6. + uNoiseT)), uCollapse);
  }
  /* reveal wipe */
  if (uReveal < 1.5){
    v *= smoothstep(uReveal + uRevealSoft, uReveal - uRevealSoft, proj);
  }
  return v;
}

void main(){
  vec2 px = gl_FragCoord.xy;
  float cell = uCell;
  vec2 cellSize = (uTex == 0) ? vec2(cell, cell * uBarRows) : vec2(cell);
  vec2 id = floor(px / cellSize);
  vec2 centre = (id + .5) * cellSize;
  vec2 f = fract(px / cellSize);

  /* jittered sample point (burst spreads the flock) */
  float jit = uJitter + uBurst;
  vec2 j = (hash22(id + 3.7) - .5) * jit * cell * 6. / uRes.y;
  vec2 q = toField(centre) + j;

  float v = field(q, id);
  v = pow(max(v * uGain, 0.), uGamma);

  float thr;
  if (uDither == 0) thr = bayer8(id);
  else if (uDither == 1) thr = hash12(id + 11.);
  else thr = ign(id);
  thr = thr * .96 + .02;

  float on = 0.;
  if (uTex == 0){
    /* bars: vertical segment inside a tall cell, length = value, random start */
    float h = hash12(id + 5.);
    float vv = clamp(v + (h - .5) * uBarJit, 0., 1.);
    float start = hash12(id + 9.) * (1. - vv);
    float inBar = step(start, f.y) * step(f.y, start + vv) * step(abs(f.x - .5), uBarW * .5);
    on = inBar * step(.03, vv) * step(thr * .6, vv + .15);
  } else {
    float sz = uDot * mix(1., clamp(v, 0., 1.), uSizeBy);
    float lit = step(thr, v);
    if (uTex == 1){
      on = lit * step(abs(f.x - .5), sz * .5) * step(abs(f.y - .5), sz * .5);
    } else {
      float r = length((f - .5) * cellSize) ;
      on = lit * step(r, sz * .5 * cell);
    }
  }
  vec3 col = mix(uBg, uFg, on);
  gl_FragColor = vec4(col, 1.);
}
</script>

<script>

const BRAND = [
  ['Primer Orange', '#FF540A'], ['Warm Coral', '#FF916B'], ['Soft Peach', '#FFBEA8'], ['Primer Cream', '#FFF0E4'],

function setUniforms(w, h, dpr, time){

  gl.uniform1f(U.uBarW, S.barW); gl.uniform1f(U.uBarRows, S.barRows); gl.uniform1f(U.uBarJit, S.barJit);
  gl.uniform1f(U.uGain, S.gain * T.breath); gl.uniform1f(U.uGamma, S.gamma); gl.uniform1f(U.uJitter, S.jitter); gl.uniform1f(U.uZoom, S.zoom);

  gl.uniform1f(U.uCore, S.core); gl.uniform1f(U.uCoreW, S.coreW); gl.uniform1f(U.uTaper, S.taper); gl.uniform1f(U.uFanW, S.fanW); gl.uniform1f(U.uFanAmt, S.fanAmt); gl.uniform1f(U.uFanScale, S.fanScale); gl.uniform1f(U.uEndFade, S.endFade);

/* one-shot triggers */
const TRIG = {};
let timeline = [];   /* [{t0, dur, fn(u)}] */
function tween(dur, fn, done){ timeline.push({ t0: now, dur, fn, done }); }
let now = 0;
TRIG.sweep = () => {
  T.sweepAmt = S.sweepAmt;
  tween(2.2, u => { T.sweep = -1.3 + u * 2.6; T.sweepAmt = S.sweepAmt * Math.sin(Math.min(1, u) * Math.PI) ** 0.5; }, () => { T.sweepAmt = 0; });
};
TRIG.burst = () => {
  tween(1.6, u => { T.burst = S.burstAmt * Math.exp(-u * 4.5) * Math.sin(Math.min(u * 6, 1) * Math.PI / 2); }, () => { T.burst = 0; });
};
TRIG.reveal = () => {
  tween(2.4, u => { const e = 1 - Math.pow(1 - u, 3); T.reveal = -1.3 + e * 2.6; }, () => { T.reveal = 9; });
};
TRIG.collapse = () => {
  T.hole = T.mouseActive ? [T.mouse[0], T.mouse[1]] : [rnd(-0.4, 0.4), rnd(-0.25, 0.25)];
  tween(2.6, u => { const a = u < 0.35 ? u / 0.35 : (u < 0.55 ? 1 : 1 - (u - 0.55) / 0.45); const e = a * a * (3 - 2 * a); T.collapse = e; T.burst = (1 - e) * (u > 0.55 ? S.burstAmt * 0.6 * e : 0); }, () => { T.collapse = 0; T.burst = 0; });
};
TRIG.morph = (target) => {
  const from = clone(strokeDisplay || S.strokes);
  const to = target || randomStrokes(S.strokes);
  tween(1.8, u => {
    const e = u * u * (3 - 2 * u);
    strokeDisplay = from.map((s, i) => ({ on: to[i].on, w: s.w + (to[i].w - s.w) * e, p: s.p.map((pt, k) => [pt[0] + (to[i].p[k][0] - pt[0]) * e, pt[1] + (to[i].p[k][1] - pt[1]) * e]) }));
    drawHandles();
  }, () => { S.strokes = clone(to); strokeDisplay = null; drawHandles(); refreshStrokeUi(); });
};
function trigger(name){ if (TRIG[name]) TRIG[name](); }

function randomStrokes(base){
  return base.map((s, i) => {
    const flip = Math.random() < 0.5 ? -1 : 1;
    const y0 = rnd(-0.4, 0.4), y3 = rnd(-0.4, 0.4);
    return { on: s.on, w: +rnd(0.02, 0.045).toFixed(3), p: [

    ] };
  });
}

/* idle motion */
let last = performance.now() / 1000, morphClock = 0, idleAngle = 0;
function frame(){
  const t = performance.now() / 1000; const dt = Math.min(0.05, t - last); last = t; now = t;
  const sp = S.speed;
  /* always-on slow evolution so the piece never freezes */
  T.noiseT += dt * S.turb * sp * (S.anim === 'Turbulence' ? 2.2 : 0.35);
  if (S.anim === 'Flow' || S.anim === 'Turbulence'){
    const a = S.flowAngle * Math.PI / 180, v = (S.anim === 'Flow' ? 0.16 : 0.06) * sp;
    T.flow[0] -= Math.cos(a) * v * dt * S.nScale; T.flow[1] -= Math.sin(a) * v * dt * S.nScale;
  }
  T.breath = S.anim === 'Breathe' ? 1 + 0.45 * Math.sin(t * 1.3 * sp) : 1;
  if (S.anim === 'Morph'){ morphClock += dt * sp; if (morphClock > 3.2 && !timeline.some(x => x.fn && x.dur === 1.8)){ morphClock = 0; TRIG.morph(); } }

  /* cursor: idle figure-eight when no pointer (or always in embed) */
  const idle = IS_EMBED || (t - T.lastMove > 2.5);
  if (idle){
    idleAngle += dt * 0.35 * sp;
    T.mouseTarget = [Math.sin(idleAngle) * 0.45, Math.sin(idleAngle * 2) * 0.22];
    T.mouseActive = S.cursor !== 'Off';
  }
  T.mouse[0] += (T.mouseTarget[0] - T.mouse[0]) * 0.06; T.mouse[1] += (T.mouseTarget[1] - T.mouse[1]) * 0.06;

  /* timeline */
  timeline = timeline.filter(x => { const u = (t - x.t0) / x.dur; if (u >= 1){ x.fn(1); x.done && x.done(); return false; } x.fn(Math.max(0, u)); return true; });

  resize();
  gl.viewport(0, 0, cvs.width, cvs.height);
  setUniforms(cvs.width, cvs.height, DPR, t);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}

function swatches(key, onChange){
  const row = document.createElement('div'); row.className = 'swatches';
  BRAND.forEach(([name, c]) => {
    const b = document.createElement('button'); b.title = name + ' ' + c; b.style.background = c;
    b.addEventListener('click', () => { S[key] = c; ui[key].input.value = c; onChange && onChange(c); clearPresetActive(); });
    row.appendChild(b);
  });
  return row;
}
function sub(items) { const d = document.createElement('div'); d.className = 'sub'; items.forEach(i => d.appendChild(i)); return d; }
function group(title, items, open = true) {
  const det = document.createElement('details'); det.open = open;
  const sum = document.createElement('summary'); sum.textContent = title;
  const grp = document.createElement('div'); grp.className = 'grp';
  items.forEach(i => grp.appendChild(i));
  det.append(sum, grp);
  groupsEl.appendChild(det);
}

/* per-ribbon controls (strokes live in an array, so they get their own tiny builders) */
const strokeUi = [];
function strokeRow(i){
  const wrap = document.createElement('div'); wrap.className = 'sub';
  const row = document.createElement('div'); row.className = 'row';
  const lab = document.createElement('label'); lab.textContent = 'Ribbon ' + (i + 1);
  const sw = document.createElement('span'); sw.className = 'switch';
  const input = document.createElement('input'); input.type = 'checkbox'; input.checked = S.strokes[i].on;
  const dot = document.createElement('i'); sw.append(input, dot);
  input.addEventListener('change', () => { S.strokes[i].on = input.checked; wRow.hidden = !input.checked; clearPresetActive(); drawHandles(); });
  row.append(lab, sw);
  const wRow = document.createElement('div'); wRow.className = 'slider-row'; wRow.hidden = !S.strokes[i].on;
  const top = document.createElement('div'); top.className = 'top';
  const l2 = document.createElement('label'); l2.textContent = 'Width'; const val = document.createElement('span'); val.className = 'val';
  top.append(l2, val);
  const r = document.createElement('input'); r.type = 'range'; r.min = 0.008; r.max = 0.12; r.step = 0.001; r.value = S.strokes[i].w;
  const refresh = () => { input.checked = S.strokes[i].on; wRow.hidden = !S.strokes[i].on; r.value = S.strokes[i].w; val.textContent = (+S.strokes[i].w).toFixed(3); };
  r.addEventListener('input', () => { S.strokes[i].w = +r.value; refresh(); clearPresetActive(); });
  wRow.append(top, r); wrap.append(row, wRow); refresh();
  strokeUi.push(refresh);
  return wrap;
}
function refreshStrokeUi(){ strokeUi.forEach(f => f()); }

const subs = {};
subs.Cloud = sub([
  slider('angle', 'Band angle', -90, 90, 1, v => v + '°'),
  slider('bandW', 'Band width', 0.05, 0.8, 0.01),
  slider('bandOff', 'Band offset', -0.6, 0.6, 0.01),
  slider('grain', 'Grain', 0, 1, 0.01),
  slider('nStretch', 'Grain stretch', 0.3, 4, 0.05),
]);
subs.Noise = sub([
  slider('nScale', 'Grain scale', 0.5, 8, 0.05),
  slider('nDetail', 'Detail', 1, 6, 1),
]);
function showSub(){ subs.Cloud.hidden = S.base !== 'Cloud'; subs.Noise.hidden = S.base === 'None'; }
group('Composition', [
  sect('Base layer'),
  modes('base', BASES),
  subs.Cloud, subs.Noise,
  sect('Ribbons — drag the handles on the canvas'),
  strokeRow(0), strokeRow(1), strokeRow(2),
  buttons([['NEW RIBBONS', () => { TRIG.morph(randomStrokes(S.strokes)); clearPresetActive(); }], ['FLIP', () => { TRIG.morph(S.strokes.map(s => ({ on: s.on, w: s.w, p: s.p.map(p => [p[0], -p[1]]) }))); clearPresetActive(); }]]),
  slider('core', 'Core', 0, 2, 0.01),
  slider('coreW', 'Core width', 0.1, 1, 0.01),
  slider('taper', 'Taper', 0, 6, 0.05),
  slider('fanAmt', 'Fan', 0, 1.5, 0.01),
  slider('fanW', 'Fan width', 1, 12, 0.1),
  slider('fanScale', 'Fan grain', 1, 10, 0.1),
  slider('endFade', 'End fade', 0, 0.4, 0.01),
  toggle('showHandles', 'Show handles', drawHandles),
  slider('zoom', 'Zoom', 0.5, 2.5, 0.02, v => (+v).toFixed(2) + '×', drawHandles),
]);
group('Texture', [
  modes('tex', TEXTURES),
  modes('dither', DITHERS),
  slider('cell', 'Cell size', 2, 40, 1, v => v + ' px'),
  slider('dot', 'Dot size', 0.1, 1, 0.01),
  slider('sizeBy', 'Size by density', 0, 1, 0.01),
  slider('barW', 'Bar width', 0.1, 1, 0.01),
  slider('barRows', 'Bar length', 2, 16, 1, v => v + ' cells'),
  slider('barJit', 'Bar jitter', 0, 1, 0.01),
  slider('gain', 'Density', 0.2, 3, 0.01),
  slider('gamma', 'Contrast', 0.4, 3, 0.01),
  slider('jitter', 'Scatter', 0, 1, 0.01),
]);
group('Colour', [
  colorCtl('bg', 'Background', setFg), swatches('bg', setFg),
  colorCtl('fg', 'Particles'), swatches('fg'),
  buttons([['SWAP', () => { const b = S.bg; S.bg = S.fg; S.fg = b; refreshUi(); setFg(); clearPresetActive(); }]]),
]);
group('Motion', [
  sect('Idle'),
  modes('anim', ANIMS, null, 'c5'),
  slider('speed', 'Speed', 0, 3, 0.05, v => (+v).toFixed(2) + '×'),
  slider('flowAngle', 'Flow direction', 0, 360, 1, v => v + '°'),
  slider('turb', 'Turbulence', 0, 1.5, 0.01),
  sect('Cursor'),
  modes('cursor', CURSORS),
  slider('mouseR', 'Reach', 0.05, 0.6, 0.01),
  slider('mouseAmt', 'Strength', 0, 2, 0.01),
], true);
group('Triggers', [
  buttons([['SWEEP', () => trigger('sweep')], ['BURST', () => trigger('burst')], ['REVEAL', () => trigger('reveal')], ['COLLAPSE', () => trigger('collapse')], ['MORPH', () => trigger('morph')]], 'trig'),
  slider('sweepAmt', 'Sweep density', 0, 3, 0.01),
  slider('sweepW', 'Sweep width', 0.03, 0.5, 0.01),
  slider('burstAmt', 'Burst spread', 0, 4, 0.01),
  slider('revealSoft', 'Reveal edge', 0.01, 0.5, 0.01),
  note('Embed with <code>?embed&amp;preset=Night</code> and fire these from the host page: <code>frame.contentWindow.postMessage({murmuration:"sweep"},"*")</code> — also <code>{murmuration:"set", key, value}</code>, <code>{murmuration:"preset", name}</code> and <code>{murmuration:"settings", settings}</code> (paste the JSON from COPY SETTINGS). Same calls on <code>window.Murmuration</code>.'),
], true);

/* presets */
const presetsEl = document.getElementById('presets');
const presetButtons = {};
Object.keys(PRESETS).forEach(name => {
  const b = document.createElement('button'); b.textContent = name;
  b.addEventListener('click', () => applyPreset(name));
  presetsEl.appendChild(b);
  presetButtons[name] = b;
});
function clearPresetActive() { Object.values(presetButtons).forEach(b => b.classList.remove('active')); }
function refreshUi() {
  Object.keys(ui).forEach(k => {
    if (!(k in S)) return;
    const c = ui[k];
    if (c.input.type === 'checkbox') c.input.checked = S[k];
    else if (c.input.type !== 'modes') c.input.value = S[k];
    c.refresh(S[k]);
  });
  refreshStrokeUi();
}
function applyAll() { showSub(); setFg(); drawHandles(); }
function applyPreset(name) {
  const p = clone(PRESETS[name]);
  strokeDisplay = null; timeline = timeline.filter(x => x.dur !== 1.8);
  Object.assign(S, p);
  refreshUi(); applyAll();
  clearPresetActive();
  if (presetButtons[name]) presetButtons[name].classList.add('active');
}
function applySettings(obj){
  strokeDisplay = null; Object.assign(S, clone(obj)); refreshUi(); applyAll(); clearPresetActive();
}

/* randomise */
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function randomise() {
  const combos = [
    ['#FF540A', '#F9FAF7'], ['#FF540A', '#FFF0E4'], ['#A098FD', '#F9FAF7'], ['#6A5DFD', '#F9FAF7'], ['#5426C0', '#CFCAFD'],
    ['#FFF0E4', '#FF540A'], ['#F9FAF7', '#0D0D0D'], ['#0D0D0D', '#F9FAF7'], ['#0D0D0D', '#FF540A'], ['#0D0D0D', '#A7D900'],
    ['#D6FB58', '#0D0D0D'], ['#A7D900', '#F9FAF7'], ['#3B7303', '#D6FB58'], ['#004BA0', '#94BFFF'], ['#4E99FB', '#F9FAF7'],
    ['#06705F', '#86F3C3'], ['#00B99B', '#F9FAF7'], ['#8F1D32', '#FFBEA8'], ['#FF916B', '#0D0D0D'], ['#CDE3FF', '#004BA0'],
  ];
  [S.bg, S.fg] = pick(combos);
  S.base = pick(['Cloud', 'Cloud', 'Cloud', 'None', 'None', 'Noise']);
  S.angle = Math.round(rnd(-45, 45)); S.bandW = +rnd(0.12, 0.45).toFixed(2); S.bandOff = +rnd(-0.35, 0.35).toFixed(2);
  S.grain = +rnd(0.6, 1).toFixed(2); S.nScale = +rnd(1.2, 4.5).toFixed(2); S.nStretch = +rnd(0.8, 2.4).toFixed(2); S.nDetail = pick([3, 4, 4, 5]);
  S.zoom = +pick([1, 1, 1, 1.15, 0.85]).toFixed(2);
  const nRib = S.base === 'None' ? pick([1, 1, 2]) : pick([0, 0, 1]);
  const rs = randomStrokes(S.strokes); rs.forEach((s, i) => s.on = i < nRib);
  S.strokes = rs; strokeDisplay = null;
  S.core = +rnd(0.3, 1.2).toFixed(2); S.coreW = +rnd(0.2, 0.5).toFixed(2); S.taper = +rnd(0.5, 4).toFixed(2);
  S.fanAmt = +rnd(0.2, 1).toFixed(2); S.fanW = +rnd(2.5, 8).toFixed(1); S.fanScale = +rnd(2, 7).toFixed(1); S.endFade = +rnd(0.04, 0.15).toFixed(2);
  S.tex = pick(['Dither', 'Dither', 'Rounded', 'Rounded', 'Bars']); S.dither = pick(DITHERS);
  S.cell = S.tex === 'Bars' ? pick([3, 4, 5, 6]) : pick([5, 6, 7, 8, 9, 10, 12, 14]);
  S.dot = +rnd(0.4, 0.75).toFixed(2); S.sizeBy = S.tex === 'Rounded' ? +pick([0, 0.5, 0.7, 1]).toFixed(2) : +pick([0, 0, 0.4]).toFixed(2);
  S.barW = +rnd(0.25, 0.6).toFixed(2); S.barRows = pick([4, 6, 8, 10]); S.barJit = +rnd(0.3, 0.7).toFixed(2);
  S.gain = +rnd(0.9, 1.5).toFixed(2); S.gamma = +rnd(1.1, 2).toFixed(2); S.jitter = +rnd(0.05, 0.4).toFixed(2);
  S.anim = pick(['Flow', 'Flow', 'Turbulence', 'Breathe', 'Morph']); S.speed = +rnd(0.5, 1.4).toFixed(2); S.flowAngle = Math.round(rnd(0, 360)); S.turb = +rnd(0.15, 0.6).toFixed(2);
  S.cursor = pick(['Attract', 'Attract', 'Repel']); S.mouseR = +rnd(0.1, 0.3).toFixed(2); S.mouseAmt = +rnd(0.3, 1).toFixed(2);
  refreshUi(); applyAll(); clearPresetActive();
}

/* panel show/hide, buttons, keys */
const panel = document.getElementById('panel');
document.getElementById('hideUi').addEventListener('click', () => panel.classList.add('hidden'));
document.getElementById('toggleUi').addEventListener('click', () => panel.classList.remove('hidden'));
document.getElementById('randomBtn').addEventListener('click', randomise);
document.getElementById('exportBtn').addEventListener('click', () => exportPNG(IS_EMBED ? 1 : (innerWidth >= 1900 ? 1 : 2)));
const toast = document.getElementById('toast');
function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1800); }
document.getElementById('copyBtn').addEventListener('click', async () => {
  const json = JSON.stringify(S, null, 2);
  try { await navigator.clipboard.writeText(json); showToast('Settings copied as JSON'); }
  catch (e) { console.log(json); showToast('Clipboard blocked — settings logged to console'); }
});
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { if (e.target.tagName === 'BUTTON') return; e.preventDefault(); trigger('sweep'); }
  else if (e.key === 'r') randomise();
  else if (e.key === 'h') panel.classList.toggle('hidden');
  else if (e.key === 'b') trigger('burst');
  else if (e.key === 'v') trigger('reveal');
  else if (e.key === 'c') trigger('collapse');
  else if (e.key === 'm') trigger('morph');
});

/* ============================== embed API ============================== */
window.Murmuration = {
  trigger, preset: applyPreset, settings: applySettings,
  set: (k, v) => { S[k] = v; refreshUi(); applyAll(); },
  get: () => clone(S), triggers: Object.keys(TRIG), _T: T,
};
addEventListener('message', e => {
  const m = e.data; if (!m || !m.murmuration) return;
  const k = m.murmuration;
  if (TRIG[k]) trigger(k);
  else if (k === 'set') window.Murmuration.set(m.key, m.value);
  else if (k === 'preset' && PRESETS[m.name]) applyPreset(m.name);
  else if (k === 'settings' && m.settings) applySettings(m.settings);
});

/* ============================== boot ============================== */
const q = new URLSearchParams(location.search);
const startPreset = q.get('preset') && PRESETS[q.get('preset')] ? q.get('preset') : 'Murmuration 1';
applyPreset(startPreset);
if (q.has('reveal')) { T.reveal = -1.3; setTimeout(() => trigger('reveal'), 300); }
resize();
requestAnimationFrame(frame);
</script>
</body>
