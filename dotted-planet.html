<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>002 · Dotted Planet — StanVision Lab</title>
<meta name="description" content="Interactive dotted planet rendered with three.js. Drag to orbit, tune density, colors and atmosphere, copy your settings. A StanVision Lab experiment.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ink:#0a0605;
    --panel:rgba(13,17,23,.86);
    --line:rgba(148,163,184,.16);
    --text:#e6ebf2;
    --mute:#8a94a3;
    --accent:#d8ff43;
    --radius:10px;
  }
  html,body{height:100%;}
  body{
    margin:0; background:var(--ink); color:var(--text);
    font-family:"Archivo",system-ui,-apple-system,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed; inset:0;}
  #glow{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    pointer-events:none; border-radius:50%; filter:blur(2px);}
  canvas{display:block; cursor:grab;}
  canvas.dragging{cursor:grabbing;}

  header{
    position:fixed; top:20px; left:24px; z-index:5; pointer-events:none;
  }
  header h1{
    margin:0; font-size:14px; font-weight:600; letter-spacing:.02em;
  }
  header p{
    margin:4px 0 0; font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:11px; letter-spacing:.04em;
  }
  header{color:var(--pagefg,#e6ebf2);}
  header p{opacity:.55;}

  #panel{
    position:fixed; top:16px; right:16px; bottom:16px; width:288px; z-index:6;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    display:flex; flex-direction:column; overflow:hidden;
    transition:transform .28s cubic-bezier(.4,0,.2,1), opacity .28s;
  }
  #panel.hidden{transform:translateX(calc(100% + 24px)); opacity:0; pointer-events:none;}
  #panel .head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px 12px; border-bottom:1px solid var(--line);
  }
  #panel .head span{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px;
    letter-spacing:.12em; text-transform:uppercase; color:var(--mute);
  }
  #panel .body{overflow-y:auto; padding:6px 16px 16px; flex:1; scrollbar-width:thin; scrollbar-color:rgba(148,163,184,.3) transparent;}
  #panel .body::-webkit-scrollbar{width:6px;}
  #panel .body::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25); border-radius:3px;}

  .presets{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:14px 0 4px;}
  .presets button{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.03em;
    color:var(--text); background:rgba(148,163,184,.08); border:1px solid var(--line);
    border-radius:8px; padding:8px 6px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .presets button:hover{border-color:rgba(148,163,184,.45);}
  .presets button.active{border-color:var(--accent); background:rgba(216,255,67,.14);}

  details{border-bottom:1px solid var(--line); padding:2px 0;}
  details:last-of-type{border-bottom:none;}
  summary{
    list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between;
    padding:12px 2px; font-size:12px; font-weight:600; letter-spacing:.02em; user-select:none;
  }
  summary::-webkit-details-marker{display:none;}
  summary::after{content:""; width:7px; height:7px; border-right:1.4px solid var(--mute);
    border-bottom:1.4px solid var(--mute); transform:rotate(45deg); transition:transform .18s; margin-right:3px;}
  details[open] summary::after{transform:rotate(-135deg); margin-top:4px;}
  .grp{padding:0 2px 14px; display:flex; flex-direction:column; gap:11px;}

  .row{display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:22px;}
  .row label{font-size:12px; color:var(--mute); flex:0 0 auto;}
  .row .val{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px; color:var(--text);
    min-width:38px; text-align:right; font-variant-numeric:tabular-nums;
  }
  .slider-row{display:flex; flex-direction:column; gap:6px;}
  .slider-row .top{display:flex; justify-content:space-between; align-items:baseline;}
  .slider-row .top label{font-size:12px; color:var(--mute);}
  .slider-row .top .val{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px; color:var(--text);
    font-variant-numeric:tabular-nums;
  }

  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:18px; background:transparent; cursor:pointer; margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{height:2px; background:rgba(148,163,184,.28); border-radius:1px;}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:12px; height:12px; border-radius:50%;
    background:var(--text); margin-top:-5px; border:none;
    transition:transform .12s; box-shadow:0 0 0 3px rgba(5,7,11,.6);
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15);}
  input[type=range]::-moz-range-track{height:2px; background:rgba(148,163,184,.28); border-radius:1px;}
  input[type=range]::-moz-range-thumb{width:12px; height:12px; border-radius:50%; background:var(--text); border:none;}

  input[type=color]{
    -webkit-appearance:none; appearance:none; width:44px; height:22px; border:1px solid var(--line);
    border-radius:6px; background:none; padding:0; cursor:pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:2px;}
  input[type=color]::-webkit-color-swatch{border:none; border-radius:4px;}
  input[type=color]::-moz-color-swatch{border:none; border-radius:4px;}

  .switch{position:relative; width:32px; height:18px; flex:0 0 auto;}
  .switch input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer;}
  .switch i{
    position:absolute; inset:0; border-radius:9px; background:rgba(148,163,184,.25);
    transition:background .18s; pointer-events:none;
  }
  .switch i::after{
    content:""; position:absolute; left:2px; top:2px; width:14px; height:14px; border-radius:50%;
    background:var(--text); transition:transform .18s;
  }
  .switch input:checked + i{background:var(--accent);}
  .switch input:checked + i::after{transform:translateX(14px);}

  .footbar{
    border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:8px;
  }
  .footbar button{
    flex:1; font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.04em;
    color:#0a0605; background:var(--text); border:none; border-radius:8px; padding:9px 0; cursor:pointer;
    transition:opacity .15s;
  }
  .footbar button:hover{opacity:.85;}

  #toggleUi{
    position:fixed; top:24px; right:16px; z-index:7; width:34px; height:34px;
    border-radius:9px; border:1px solid var(--line); background:var(--panel);
    backdrop-filter:blur(14px); color:var(--mute); cursor:pointer; font-size:15px; line-height:1;
    display:none; align-items:center; justify-content:center;
  }
  #panel.hidden ~ #toggleUi{display:flex;}

  #toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,12px); z-index:9;
    background:var(--text); color:#0a0605; font-size:12px; font-weight:500;
    padding:8px 14px; border-radius:8px; opacity:0; transition:opacity .2s, transform .2s;
    pointer-events:none;
  }
  #toast.show{opacity:1; transform:translate(-50%,0);}

  .hidebtn{background:none; border:none; color:var(--mute); font-size:15px; cursor:pointer; padding:2px 4px; line-height:1;}
  .hidebtn:hover{color:var(--text);}

  @media (max-width:720px){
    #panel{top:auto; left:12px; right:12px; bottom:12px; width:auto; max-height:46vh;}
    #panel.hidden{transform:translateY(calc(100% + 20px));}
    header{left:16px; top:16px;}
    #toggleUi{top:auto; bottom:20px;}
  }
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

  /* lab header conventions */
  header{pointer-events:none;}
  header a.lab-back{
    pointer-events:auto; color:var(--text); text-decoration:none;
    display:flex; align-items:center; gap:10px;
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; letter-spacing:.04em;
  }
  header a.lab-back .idx{color:#d8ff43;}
  header a.lab-back:hover .lbl{text-decoration:underline; text-underline-offset:3px;}
  html.embed header, html.embed #panel, html.embed #toggleUi, html.embed #toast{display:none !important;}
</style>
</head>

const MASK_B64 = MASK_PACKED.replace(/~(.)([0-9a-f]+)\./g, (m, c, n) => c.repeat(parseInt(n, 16)));
const maskBytes = Uint8Array.from(atob(MASK_B64), c => c.charCodeAt(0));
function isLand(lat, lng) {
  let col = Math.floor((lng + 180) / 360 * MASK_W);
  let row = Math.floor((90 - lat) / 180 * MASK_H);
  col = ((col % MASK_W) + MASK_W) % MASK_W;
  row = Math.min(MASK_H - 1, Math.max(0, row));
  const idx = row * MASK_W + col;
  return (maskBytes[idx >> 3] >> (idx & 7)) & 1;
}
function isCoast(lat, lng) {
  if (!isLand(lat, lng)) return false;
  const d = 0.5; // one mask cell
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    if (!isLand(lat + dy * d, lng + dx * d)) return true;
  }
  return false;
}

/* ---------- inner sphere (occluder + two-tone rim gradient) ---------- */
const sphereUniforms = {
  uBg: { value: new THREE.Color(S.bgColor) },
  uSurface: { value: S.surfaceLight },
  uWarm: L.uWarm, uCool: L.uCool, uWarmI: L.uWarmI, uCoolI: L.uCoolI,
  uDir: L.uDir, uSpread: L.uSpread,
};
const innerSphere = new THREE.Mesh(
  new THREE.SphereGeometry(0.992, 96, 96),
  new THREE.ShaderMaterial({
    uniforms: sphereUniforms,
    vertexShader: `
      varying vec3 vNv;   // view-space normal
      varying vec3 vNw;   // world normal
      varying vec3 vV;    // world view dir
      void main(){
        vec4 wp = modelMatrix * vec4(position,1.0);
        vNw = normalize(mat3(modelMatrix) * normal);
        vNv = normalize((viewMatrix * vec4(vNw, 0.0)).xyz);
        vV = normalize(cameraPosition - wp.xyz);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: lightGLSL + `
      uniform vec3 uBg; uniform float uSurface;
      varying vec3 vNv; varying vec3 vNw; varying vec3 vV;
      void main(){
        float ndv = max(dot(normalize(vNw), normalize(vV)), 0.0);
        float rim = pow(1.0 - ndv, uSpread);
        vec2 nS = normalize(vNv.xy + vec2(1e-5));
        float fWarm = smoothstep(-0.25, 1.0, dot(nS,  uDir));
        float fCool = smoothstep(-0.25, 1.0, dot(nS, -uDir));
        vec3 base = uBg * (0.10 + uSurface * 0.9);
        vec3 col = base;
        float edge = pow(1.0 - ndv, uSpread * 2.2);
        col += uWarm * (rim * 0.55 + edge * 1.3) * fWarm * uWarmI;
        col += uCool * (rim * 0.55 + edge * 1.3) * fCool * uCoolI;
        // soft light bleed onto the facing surface
        float mid = pow(1.0 - ndv, 1.4);
        col += (uWarm * fWarm * uWarmI + uCool * fCool * uCoolI) * mid * uSurface * 0.22;
        gl_FragColor = vec4(col, 1.0);
      }`,
  })
);
spinGroup.add(innerSphere);

/* ---------- outer atmosphere shell (the "halo ring", off by default) ---------- */
const atmoShell = new THREE.Mesh(
  new THREE.SphereGeometry(1.0, 64, 64),
  new THREE.ShaderMaterial({
    uniforms: { uWarm: L.uWarm, uCool: L.uCool, uWarmI: L.uWarmI, uCoolI: L.uCoolI, uDir: L.uDir, uSpread: L.uSpread },
    side: THREE.BackSide, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      varying vec3 vNv; varying vec3 vNw; varying vec3 vV;
      void main(){
        vec4 wp = modelMatrix * vec4(position,1.0);
        vNw = normalize(mat3(modelMatrix) * normal);
        vNv = normalize((viewMatrix * vec4(vNw, 0.0)).xyz);
        vV = normalize(cameraPosition - wp.xyz);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: lightGLSL + `
      varying vec3 vNv; varying vec3 vNw; varying vec3 vV;
      void main(){
        float rim = pow(1.0 + dot(normalize(vNw), normalize(vV)), 3.0) * 0.5;
        vec2 nS = normalize(vNv.xy + vec2(1e-5));
        float fWarm = smoothstep(-0.3, 1.0, dot(nS,  uDir));
        float fCool = smoothstep(-0.3, 1.0, dot(nS, -uDir));
        vec3 col = uWarm * fWarm * uWarmI + uCool * fCool * uCoolI;
        gl_FragColor = vec4(col, rim * 0.5);
      }`,
  })
);
atmoShell.scale.setScalar(1.13);
atmoShell.visible = S.shell;
scene.add(atmoShell);

/* ---------- dot layers (fill + coastline) ---------- */
const dotShared = {
  uColor: { value: new THREE.Color(S.dotColor) },
  uOpacity: { value: S.dotOpacity },
  uOceanOpacity: { value: S.oceanOpacity },
  uAltitude: { value: S.dotAltitude },
  uTint: { value: S.dotTint },
  uPixelRatio: { value: Math.min(devicePixelRatio, 2) },
};
function makeDotUniforms(size) {
  return {
    uSize: { value: size },
    uColor: dotShared.uColor, uOpacity: dotShared.uOpacity,
    uOceanOpacity: dotShared.uOceanOpacity, uAltitude: dotShared.uAltitude,
    uTint: dotShared.uTint, uPixelRatio: dotShared.uPixelRatio,
    uWarm: L.uWarm, uCool: L.uCool, uWarmI: L.uWarmI, uCoolI: L.uCoolI,
    uDir: L.uDir, uSpread: L.uSpread,
  };
}
const fillUniforms = makeDotUniforms(S.dotSize);
const coastUniforms = makeDotUniforms(S.coastSize);
const dotVert = `
  attribute float aKind; // 1 = land, 0 = ocean
  uniform float uSize; uniform float uPixelRatio; uniform float uAltitude;
  uniform vec2 uDir;
  varying float vFade; varying float vKind; varying float vWarm; varying float vCool;
  void main(){
    vKind = aKind;
    vec3 p = position * (1.0 + uAltitude);
    vec4 wp = modelMatrix * vec4(p, 1.0);
    vec3 nW = normalize(mat3(modelMatrix) * position);
    vec3 nV = normalize((viewMatrix * vec4(nW, 0.0)).xyz);
    vec3 vDir = normalize(cameraPosition - wp.xyz);
    float facing = dot(nW, vDir);
    vFade = smoothstep(0.12, 0.45, facing);
    float rim = pow(1.0 - max(facing, 0.0), 1.6);
    vec2 nS = normalize(nV.xy + vec2(1e-5));
    vWarm = rim * smoothstep(-0.2, 1.0, dot(nS,  uDir));
    vCool = rim * smoothstep(-0.2, 1.0, dot(nS, -uDir));
    vec4 mv = viewMatrix * wp;
    gl_PointSize = uSize * uPixelRatio * (4.2 / -mv.z);
    gl_Position = projectionMatrix * mv;
  }`;
const dotFrag = `
  uniform vec3 uColor; uniform float uOpacity; uniform float uOceanOpacity; uniform float uTint;
  uniform vec3 uWarm; uniform vec3 uCool; uniform float uWarmI; uniform float uCoolI;
  varying float vFade; varying float vKind; varying float vWarm; varying float vCool;
  void main(){
    vec2 uv = gl_PointCoord - 0.5;
    float d = length(uv);
    float mask = 1.0 - smoothstep(0.38, 0.5, d);
    if (mask < 0.01) discard;
    vec3 col = uColor;
    col = mix(col, uWarm, clamp(vWarm * uWarmI, 0.0, 1.0) * uTint);
    col = mix(col, uCool, clamp(vCool * uCoolI, 0.0, 1.0) * uTint);
    float a = mask * vFade * mix(uOceanOpacity, uOpacity, vKind);
    gl_FragColor = vec4(col, a);
  }`;
function makePoints(uniforms) {
  return new THREE.ShaderMaterial({
    uniforms, vertexShader: dotVert, fragmentShader: dotFrag,
    transparent: true, depthWrite: false,
  });
}
let fillPoints = null, coastPoints = null;
function sampleSphere(rows, keep) {
  const positions = [], kinds = [];
  for (let r = 0; r < rows; r++) {
    const lat = -90 + (r + 0.5) * 180 / rows;
    const phi = (90 - lat) * Math.PI / 180;
    const ringCount = Math.max(1, Math.round(2 * rows * Math.sin(phi)));
    for (let c = 0; c < ringCount; c++) {
      const lng = -180 + (c + 0.5) * 360 / ringCount;
      const kind = keep(lat, lng);
      if (kind === null) continue;
      const theta = (lng + 180) * Math.PI / 180;
      positions.push(Math.sin(phi) * Math.cos(theta), Math.cos(phi), Math.sin(phi) * Math.sin(theta));
      kinds.push(kind);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('aKind', new THREE.Float32BufferAttribute(kinds, 1));
  return geo;
}
function buildFill() {
  if (fillPoints) { spinGroup.remove(fillPoints); fillPoints.geometry.dispose(); fillPoints.material.dispose(); fillPoints = null; }
  const geo = sampleSphere(S.density, (lat, lng) => {
    const land = isLand(lat, lng);
    if (!land && !S.oceanDots) return null;
    return land ? 1 : 0;
  });
  fillPoints = new THREE.Points(geo, makePoints(fillUniforms));
  spinGroup.add(fillPoints);
}
function buildCoast() {
  if (coastPoints) { spinGroup.remove(coastPoints); coastPoints.geometry.dispose(); coastPoints.material.dispose(); coastPoints = null; }
  if (S.coastDensity < 80) return; // slider floor-off
  const geo = sampleSphere(S.coastDensity, (lat, lng) => isCoast(lat, lng) ? 1 : null);
  coastPoints = new THREE.Points(geo, makePoints(coastUniforms));
  spinGroup.add(coastPoints);
}
buildFill(); buildCoast();

/* ---------- helpers ---------- */
function latLngToVec(lat, lng, r = 1) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lng + 180) * Math.PI / 180;
  return new THREE.Vector3(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.cos(phi),
    r * Math.sin(phi) * Math.sin(theta)
  );
}

/* ---------- arcs between freight hubs ---------- */
const HUBS = [
  [1.35, 103.82],   // Singapore
  [22.32, 114.17],  // Hong Kong
  [31.23, 121.47],  // Shanghai
  [35.68, 139.69],  // Tokyo
  [-33.87, 151.21], // Sydney
  [-37.81, 144.96], // Melbourne
  [13.76, 100.50],  // Bangkok
  [14.60, 120.98],  // Manila
  [19.08, 72.88],   // Mumbai
  [25.20, 55.27],   // Dubai
  [51.92, 4.48],    // Rotterdam
  [33.74, -118.26], // Los Angeles
];
const ROUTES = [[0,1],[0,4],[1,3],[0,8],[1,11],[0,9],[9,10],[2,11],[0,6],[3,4],[2,3],[0,7],[5,0],[8,10]];
const arcUniforms = {
  uColor: { value: new THREE.Color(S.arcColor) },
  uTime: { value: 0 },
  uSpeed: { value: S.arcSpeed },
};
let arcLines = null;
function buildArcs() {
  if (arcLines) { spinGroup.remove(arcLines); arcLines.geometry.dispose(); arcLines.material.dispose(); arcLines = null; }
  if (!S.arcs) return;
  const SEG = 60;
  const positions = [], ts = [], offs = [];
  ROUTES.forEach(([a, b], ri) => {
    const va = latLngToVec(HUBS[a][0], HUBS[a][1]);
    const vb = latLngToVec(HUBS[b][0], HUBS[b][1]);
    const angle = va.angleTo(vb);
    const lift = 0.1 + Math.min(angle, 1.1) * 0.14;
    const off = (ri * 0.37) % 1;
    let prev = null, prevT = 0;
    for (let i = 0; i <= SEG; i++) {
      const t = i / SEG;
      const v = new THREE.Vector3().copy(va).multiplyScalar(Math.sin((1 - t) * angle) / Math.sin(angle))
        .add(new THREE.Vector3().copy(vb).multiplyScalar(Math.sin(t * angle) / Math.sin(angle)));
      v.normalize().multiplyScalar(1 + Math.sin(t * Math.PI) * lift);
      if (prev) {
        positions.push(prev.x, prev.y, prev.z, v.x, v.y, v.z);
        ts.push(prevT, t);
        offs.push(off, off);
      }
      prev = v; prevT = t;
    }
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('aT', new THREE.Float32BufferAttribute(ts, 1));
  geo.setAttribute('aOff', new THREE.Float32BufferAttribute(offs, 1));
  arcLines = new THREE.LineSegments(geo, new THREE.ShaderMaterial({
    uniforms: arcUniforms, transparent: true, depthWrite: false,
    vertexShader: `
      attribute float aT; attribute float aOff;
      varying float vT; varying float vOff; varying float vFade;
      void main(){
        vT = aT; vOff = aOff;
        vec4 wp = modelMatrix * vec4(position,1.0);
        vec3 nW = normalize(mat3(modelMatrix) * position);
        vec3 vDir = normalize(cameraPosition - wp.xyz);
        vFade = smoothstep(0.15, 0.5, dot(nW, vDir));
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      uniform vec3 uColor; uniform float uTime; uniform float uSpeed;
      varying float vT; varying float vOff; varying float vFade;
      void main(){
        float base = 0.16;
        float head = fract(vT - uTime * uSpeed + vOff);
        float pulse = smoothstep(0.28, 0.0, head) * step(0.0001, uSpeed);
        float edge = sin(vT * 3.14159);
        float a = (base + pulse * 0.9) * vFade * smoothstep(0.0, 0.15, edge);
        gl_FragColor = vec4(uColor, a);
      }`,
  }));
  spinGroup.add(arcLines);
}
buildArcs();

/* ---------- hub markers (rounded squares, like the reference) ---------- */
const hubUniforms = {
  uColor: { value: new THREE.Color(S.arcColor) },
  uPixelRatio: { value: Math.min(devicePixelRatio, 2) },
};
let hubPoints = null;
function buildHubs() {
  if (hubPoints) { spinGroup.remove(hubPoints); hubPoints.geometry.dispose(); hubPoints.material.dispose(); hubPoints = null; }
  if (!S.hubs) return;
  const positions = [];
  HUBS.forEach(([lat, lng]) => { const v = latLngToVec(lat, lng, 1.006); positions.push(v.x, v.y, v.z); });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  hubPoints = new THREE.Points(geo, new THREE.ShaderMaterial({
    uniforms: hubUniforms, transparent: true, depthWrite: false,
    vertexShader: `
      uniform float uPixelRatio;
      varying float vFade;
      void main(){
        vec4 wp = modelMatrix * vec4(position,1.0);
        vec3 nW = normalize(mat3(modelMatrix) * position);
        vec3 vDir = normalize(cameraPosition - wp.xyz);
        vFade = smoothstep(0.1, 0.42, dot(nW, vDir));
        vec4 mv = viewMatrix * wp;
        gl_PointSize = 9.0 * uPixelRatio * (4.2 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor;
      varying float vFade;
      void main(){
        vec2 uv = abs(gl_PointCoord - 0.5);
        float d = max(uv.x, uv.y);
        float a = (1.0 - smoothstep(0.26, 0.34, d)) * vFade;
        if (a < 0.02) discard;
        gl_FragColor = vec4(uColor, a);
      }`,
  }));
  spinGroup.add(hubPoints);
}
buildHubs();

/* ---------- stars ---------- */
let starPoints = null;
const starUniforms = {
  uPixelRatio: { value: Math.min(devicePixelRatio, 2) },
  uColor: { value: new THREE.Color('#cdbfae') },
};
function buildStars() {
  if (starPoints) { scene.remove(starPoints); starPoints.geometry.dispose(); starPoints.material.dispose(); starPoints = null; }
  if (!S.stars) return;
  const n = S.starDensity;
  const positions = [], sizes = [];
  for (let i = 0; i < n; i++) {
    const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, rr = Math.sqrt(1 - u * u);
    const v = new THREE.Vector3(rr * Math.cos(th), u, rr * Math.sin(th)).multiplyScalar(30 + Math.random() * 20);
    positions.push(v.x, v.y, v.z);
    sizes.push(0.5 + Math.random() * 1.4);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes, 1));
  starPoints = new THREE.Points(geo, new THREE.ShaderMaterial({
    uniforms: starUniforms, transparent: true, depthWrite: false,
    vertexShader: `
      attribute float aSize; uniform float uPixelRatio;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position,1.0);
        gl_PointSize = aSize * uPixelRatio;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor;
      void main(){
        vec2 uv = gl_PointCoord - 0.5;
        float a = 1.0 - smoothstep(0.2, 0.5, length(uv));
        gl_FragColor = vec4(uColor, a * 0.7);
      }`,
  }));
  scene.add(starPoints);
}
buildStars();

/* ============================== interaction ============================== */
let dragging = false, px = 0, py = 0, vyaw = 0;
let pitch = 0, targetZoom = S.zoom;
const cvs = renderer.domElement;
cvs.addEventListener('pointerdown', e => {
  if (!S.dragSpin) return;
  dragging = true; px = e.clientX; py = e.clientY; cvs.classList.add('dragging');
  cvs.setPointerCapture(e.pointerId);
});
cvs.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - px, dy = e.clientY - py;
  px = e.clientX; py = e.clientY;
  vyaw = dx * 0.005;
  spinGroup.rotation.y += vyaw;
  pitch = Math.max(-0.7, Math.min(0.7, pitch + dy * 0.004));
});
cvs.addEventListener('pointerup', () => { dragging = false; cvs.classList.remove('dragging'); });
cvs.addEventListener('pointercancel', () => { dragging = false; cvs.classList.remove('dragging'); });
cvs.addEventListener('wheel', e => {
  if (!S.scrollZoom) return;
  e.preventDefault();
  targetZoom = Math.max(2.5, Math.min(8, targetZoom + e.deltaY * 0.0025));
  ui.zoom && (ui.zoom.input.value = targetZoom, ui.zoom.refresh(targetZoom));
  S.zoom = targetZoom;
  updateGlow();
}, { passive: false });

/* ============================== glow halo (CSS, two-tone) ============================== */
const glowEl = document.getElementById('glow');
function rgbOf(hex) {
  const c = new THREE.Color(hex);
  return `${Math.round(c.r*255)},${Math.round(c.g*255)},${Math.round(c.b*255)}`;
}
function updateGlow() {
  const base = Math.min(innerWidth, innerHeight);
  const size = base * 1.2 * (4.2 / S.zoom);
  glowEl.style.width = glowEl.style.height = size + 'px';
  const g = S.glowStrength;
  const th = S.lightAngle * Math.PI / 180;
  const ax = 50 + 40 * Math.sin(th), ay = 50 - 40 * Math.cos(th);
  const bx = 50 - 40 * Math.sin(th), by = 50 + 40 * Math.cos(th);
  const A = rgbOf(S.warmColor), B = rgbOf(S.coolColor);
  glowEl.style.background =
    `radial-gradient(circle at ${ax}% ${ay}%, rgba(${A},${(0.30*g*S.warmStrength).toFixed(3)}) 0%, rgba(${A},0) 52%),` +
    `radial-gradient(circle at ${bx}% ${by}%, rgba(${B},${(0.30*g*S.coolStrength).toFixed(3)}) 0%, rgba(${B},0) 52%)`;
}

/* ============================== resize & loop ============================== */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  updateGlow();
}
addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (S.autoRotate && !dragging) spinGroup.rotation.y += S.rotateSpeed * dt;
  if (!dragging && Math.abs(vyaw) > 0.0001) { spinGroup.rotation.y += vyaw; vyaw *= 0.94; }
  tiltGroup.rotation.z = S.tilt * Math.PI / 180;
  tiltGroup.rotation.x = pitch;
  camera.position.z += (targetZoom - camera.position.z) * 0.08;
  arcUniforms.uTime.value += dt;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============================== control panel ============================== */
const ui = {};
const groupsEl = document.getElementById('groups');

function slider(key, label, min, max, step, fmt, onChange) {
  const wrap = document.createElement('div');
  wrap.className = 'slider-row';
  const top = document.createElement('div'); top.className = 'top';
  const lab = document.createElement('label'); lab.textContent = label;
  const val = document.createElement('span'); val.className = 'val';
  top.append(lab, val);
  const input = document.createElement('input');
  input.type = 'range'; input.min = min; input.max = max; input.step = step; input.value = S[key];
  const refresh = v => { val.textContent = fmt ? fmt(v) : (+v).toFixed(step < 1 ? (step < 0.1 ? 2 : 1) : 0); };
  refresh(S[key]);
  input.addEventListener('input', () => {
    S[key] = +input.value; refresh(S[key]); onChange && onChange(S[key]); clearPresetActive();
  });
  wrap.append(top, input);
  ui[key] = { input, refresh };
  return wrap;
}
function colorCtl(key, label, onChange) {
  const row = document.createElement('div'); row.className = 'row';
  const lab = document.createElement('label'); lab.textContent = label;
  const input = document.createElement('input'); input.type = 'color'; input.value = S[key];
  input.addEventListener('input', () => { S[key] = input.value; onChange && onChange(S[key]); clearPresetActive(); });
  row.append(lab, input);
  ui[key] = { input, refresh: () => {} };
  return row;
}
function toggle(key, label, onChange) {
  const row = document.createElement('div'); row.className = 'row';
  const lab = document.createElement('label'); lab.textContent = label;
  const sw = document.createElement('span'); sw.className = 'switch';
  const input = document.createElement('input'); input.type = 'checkbox'; input.checked = S[key];
  const i = document.createElement('i');
  sw.append(input, i);
  input.addEventListener('change', () => { S[key] = input.checked; onChange && onChange(S[key]); clearPresetActive(); });
  row.append(lab, sw);
  ui[key] = { input, refresh: () => {} };
  return row;
}
function group(title, items, open = true) {
  const det = document.createElement('details'); det.open = open;
  const sum = document.createElement('summary'); sum.textContent = title;
  const grp = document.createElement('div'); grp.className = 'grp';
  items.forEach(i => grp.appendChild(i));
  det.append(sum, grp);
  groupsEl.appendChild(det);
}

group('Motion', [

  slider('rotateSpeed', 'Speed', 0, 0.8, 0.01),
  slider('tilt', 'Axis tilt', -45, 45, 1, v => v + '°'),
  slider('zoom', 'Zoom', 2.5, 8, 0.05, v => (+v).toFixed(2), v => { targetZoom = v; updateGlow(); }),
]);
group('Dots', [
  slider('density', 'Fill density', 60, 280, 5, v => v + '', () => buildFill()),
  slider('coastDensity', 'Coast density', 60, 420, 10, v => v < 80 ? 'off' : v + '', () => buildCoast()),
  slider('dotSize', 'Fill size', 0.6, 5, 0.05, null, upd.dots),
  slider('coastSize', 'Coast size', 0.6, 5, 0.05, null, upd.dots),
  slider('dotAltitude', 'Altitude', 0, 0.2, 0.002, v => (+v).toFixed(3), upd.dots),
  slider('dotOpacity', 'Opacity', 0.1, 1, 0.01, null, upd.dots),
  colorCtl('dotColor', 'Dot color', upd.dots),
  slider('dotTint', 'Light tint', 0, 1, 0.02, null, upd.dots),
  toggle('oceanDots', 'Ocean dots', () => buildFill()),
  slider('oceanOpacity', 'Ocean opacity', 0.02, 0.5, 0.01, null, upd.dots),
]);
group('Glow', [
  colorCtl('warmColor', 'Top light', upd.lights),
  slider('warmStrength', 'Top strength', 0, 2, 0.02, null, upd.lights),
  colorCtl('coolColor', 'Bottom light', upd.lights),
  slider('coolStrength', 'Bottom strength', 0, 2, 0.02, null, upd.lights),
  slider('lightAngle', 'Angle', -180, 180, 1, v => v + '°', upd.lights),
  slider('spread', 'Rim spread', 1.2, 6, 0.05, null, upd.lights),
  slider('glowStrength', 'Halo glow', 0, 1.2, 0.02, null, updateGlow),
  slider('surfaceLight', 'Surface light', 0, 1, 0.02, null, upd.scene),
  toggle('shell', 'Outer ring', upd.lights),
]);
group('Routes', [
  toggle('arcs', 'Flight arcs', () => buildArcs()),
  slider('arcSpeed', 'Pulse speed', 0, 1.5, 0.02, null, upd.arcs),
  colorCtl('arcColor', 'Arc color', upd.arcs),
  toggle('hubs', 'Hub markers', () => buildHubs()),
], false);
group('Scene', [
  colorCtl('bgColor', 'Background', upd.scene),
  toggle('stars', 'Stars', () => buildStars()),
  slider('starDensity', 'Star count', 200, 3000, 50, v => v + '', () => buildStars()),
], false);

/* presets */
const presetsEl = document.getElementById('presets');
let presetButtons = {};
Object.keys(PRESETS).forEach(name => {
  const b = document.createElement('button');
  b.textContent = name;
  b.addEventListener('click', () => applyPreset(name));
  presetsEl.appendChild(b);
  presetButtons[name] = b;
});
function clearPresetActive() {
  Object.values(presetButtons).forEach(b => b.classList.remove('active'));
}
function applyPreset(name) {
  Object.assign(S, PRESETS[name]);
  if (reducedMotion) { S.autoRotate = false; S.arcSpeed = 0; }
  targetZoom = S.zoom;
  Object.keys(ui).forEach(k => {
    if (!(k in S)) return;
    const c = ui[k];
    if (c.input.type === 'checkbox') c.input.checked = S[k];
    else c.input.value = S[k];
    c.refresh(S[k]);
  });
  buildFill(); buildCoast(); buildArcs(); buildHubs(); buildStars();
  upd.dots(); upd.scene(); upd.lights(); upd.arcs(); upd.interact(); updateGlow();
  clearPresetActive();
  presetButtons[name].classList.add('active');
}
upd.dots(); upd.scene(); upd.lights(); upd.interact(); updateGlow();
presetButtons['United Carriers'].classList.add('active');

/* panel show/hide */
const panel = document.getElementById('panel');
document.getElementById('hideUi').addEventListener('click', () => panel.classList.add('hidden'));
document.getElementById('toggleUi').addEventListener('click', () => panel.classList.remove('hidden'));

/* copy settings */
const toast = document.getElementById('toast');
document.getElementById('copyBtn').addEventListener('click', async () => {
  const json = JSON.stringify(S, null, 2);
  try {
    await navigator.clipboard.writeText(json);
    toast.textContent = 'Settings copied as JSON';
  } catch (e) {
    toast.textContent = 'Clipboard blocked — settings logged to console';
    console.log(json);
  }
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
});
</script>
</body>
</html>
