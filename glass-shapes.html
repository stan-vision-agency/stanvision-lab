<script type="x-shader/x-fragment" id="fs">
precision highp float;
#define N 10
uniform vec2 R; uniform float T;
uniform vec3 uC[N], uU[N], uV[N], uNn[N];
uniform vec4 uD[N], uRr[N], uM[N];
uniform float uN;
uniform vec3 cA, cB, cAcc, cDeep, cBg0, cBg1, cLight;
uniform vec3 uRo, uCu, uCv, uCw, uL;
uniform vec2 uOff;
uniform float uFl, uOp, uFrost, uLip, uLipAmt, uGloss, uIrid, uGlow, uRefr, uSh, uShSoft, uGrad, uDof, uFocus, uGrain, uVig, uBgZ;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float bx(vec2 p, vec2 b){vec2 q=abs(p)-b; return min(max(q.x,q.y),0.)+length(max(q,0.));}
/* rounded box with a radius per corner: r = top-right, bottom-right, top-left, bottom-left */
float rb(vec2 p, vec2 b, vec4 r){
  r.xy=(p.x>0.)?r.xy:r.zw; r.x=(p.y>0.)?r.x:r.y;
  vec2 q=abs(p)-b+r.x; return min(max(q.x,q.y),0.)+length(max(q,0.))-r.x;
}
/* the StanVision +: arms a third of the width, square hole in the centre */
float plus(vec2 p, float a){
  float w=a/3., rr=a*.05;
  float c=min(bx(p,vec2(a-rr,w-rr)),bx(p,vec2(w-rr,a-rr)))-rr;
  return max(c,-(bx(p,vec2(w*.75-rr))-rr));
}
/* D = half width, half height, ring width (large = solid), plus amount */
float sd(vec2 p, vec4 D, vec4 r){
  float d=rb(p,D.xy,r);
  d=max(d,-d-D.z);
  if(D.w>.002) d=mix(d,plus(p,min(D.x,D.y)),D.w);
  return d;
}
/* how much of the light reaching P is blocked by the other shapes */
float shadow(vec3 P, float self){
  float s=0.;
  for(int j=0;j<N;j++){
    if(float(j)>=uN) break;
    if(abs(float(j)-self)<.5) continue;
    vec3 n=uNn[j];
    float dn=dot(uL,n); if(abs(dn)<.02) continue;
    float t=dot(uC[j]-P,n)/dn; if(t<=.002) continue;
    vec3 Q=P+uL*t-uC[j];
    float d=sd(vec2(dot(Q,uU[j]),dot(Q,uV[j])),uD[j],uRr[j]);
    float pen=.012+t*uShSoft;
    float o=smoothstep(pen,-pen,d)*(.45+.55*uM[j].y)/(1.+t*.55);
    s=s+o-s*o;
  }
  return s;
}
void main(){
  vec2 uv0=(gl_FragCoord.xy-.5*R)/R.y*2.;
  vec2 uv=uv0+uOff;
  vec3 rd=normalize(uCu*uv.x+uCv*uv.y+uCw*uFl), ro=uRo;
  float pxa=2.2/(R.y*uFl);
  vec3 Lf=normalize(uCu*(-dot(uL,uCu))+uCv*.35-uCw*.6);
  vec3 col=vec3(0.), bend=vec3(0.); float tr=1., fr=0., tF=0., tB=0.;

  /* planes are picked nearest first for every pixel, so tilted shapes cross each other correctly */
  float lastT=0., lastI=-1.;
  for(int pass=0;pass<N;pass++){
    if(float(pass)>=uN||tr<.012) break;
    float t=1e9, fi=-1.; vec3 C, Uu, Vv, n; vec4 D, rr, m;
    for(int j=0;j<N;j++){
      if(float(j)>=uN) break;
      vec3 nj=uNn[j]; float dj=dot(rd,nj);
      if(abs(dj)<.001) continue;
      float tj=dot(uC[j]-ro,nj)/dj;
      if((tj>lastT||(tj==lastT&&float(j)>lastI))&&tj<t){t=tj; fi=float(j); n=nj; C=uC[j]; Uu=uU[j]; Vv=uV[j]; D=uD[j]; rr=uRr[j]; m=uM[j];}
    }
    if(fi<0.) break;
    lastT=t; lastI=fi;
    float dn=dot(rd,n);
    vec3 P=ro+rd*t+bend*max(t-tB,0.), Pl=P-C;
    vec2 q=vec2(dot(Pl,Uu),dot(Pl,Vv));
    float d=sd(q,D,rr);
    float px=t*pxa/sqrt(max(abs(dn),.15));
    float bl=fr*(.02+max(t-tF,0.)*.4)+uDof*abs(dot(P-uRo,uCw)-uFocus);
    float w=max(px,bl);
    float cov=smoothstep(w,-w,d);
    if(cov<.002) continue;

    vec3 Nf=n*(dn>0.?-1.:1.);
    float bw=min(min(uLip*m.w,D.z*.45),min(D.x,D.y)*mix(.7,.1,D.w))+.0005;
    float e=max(px,.004);
    vec2 g=vec2(sd(q+vec2(e,0.),D,rr)-sd(q-vec2(e,0.),D,rr),sd(q+vec2(0.,e),D,rr)-sd(q-vec2(0.,e),D,rr));
    g/=max(length(g),1e-5);
    vec3 G=Uu*g.x+Vv*g.y;
    float det=smoothstep(bw*1.6,bw*.15,bl);
    float k=clamp(1.+d/bw,0.,1.);
    float ang=k*k*1.42;
    vec3 Nb=normalize(Nf*cos(ang)+G*sin(ang));
    float gL=dot(G,uL);

    float sh=uSh>0.?shadow(P+Nf*.002,fi):0.;
    vec3 base=mix(mix(cA,cB,m.x),cAcc,m.z);
    vec3 dark=mix(base*.62,cDeep,.3), lit=mix(base,cLight,.55);
    vec2 lq=vec2(dot(uL,Uu),dot(uL,Vv));
    float gt=dot(q,lq)/max(D.x,D.y);
    float face=pow(max(dot(reflect(rd,Nf),uL),0.),3.);
    float s=.5+.34*gt*uGrad+.3*(dot(Nf,uL)-.62)+.22*face*uGloss-sh*uSh*.5;
    vec3 c=s<.5?mix(dark,base,smoothstep(0.,.5,s)):mix(base,lit,smoothstep(.5,1.1,s)*.85);

    /* the lip: a band along the edge, light where it faces the lamp, dark on the far side */
    vec3 band=mix(mix(c,dark,.55),lit,clamp(.58+.7*gL-sh*uSh*.3,0.,1.));
    c=mix(c,band,smoothstep(0.,.55,k)*uLipAmt*det*.85);
    c+=lit*exp(min(d,0.)/(bw*1.6+.012))*smoothstep(-bw*2.6,-bw*.8,d)*max(gL,0.)*uGlow*.3;
    float l2=exp(-pow((d+bw)/(px*1.6),2.))*det*uLipAmt;
    c=mix(c,gL<0.?lit:dark,l2*.3);

    vec3 rf=reflect(rd,Nb);
    float rl=max(dot(rf,uL),0.);
    float sp=pow(rl,70.)*1.5+pow(rl,9.)*.2+pow(max(dot(rf,Lf),0.),16.)*.22;
    float F=pow(1.-max(dot(-rd,Nb),0.),3.);
    vec3 ir=.5+.5*cos(6.2832*(k*1.15+gL*.55+vec3(0.,.33,.67)));
    c+=cLight*mix(vec3(1.),ir*1.5,uIrid)*sp*uGloss*(.15+.85*k)*det;
    c+=(ir-.5)*uIrid*k*det*.3;
    c+=cLight*smoothstep(px*2.6,0.,-d)*(.18+.55*max(gL,0.))*det*uLipAmt;
    c=mix(c,mix(cBg0,cLight,.5),F*.25*det);

    float a=cov*clamp(uOp*m.y+(k*.45+F*.4)*det*uLipAmt,0.,1.);
    col+=tr*a*c; tr*=1.-a;
    float f=cov*uFrost;
    tF=mix(tF,t,f/(fr+f+1e-4)); fr+=f;
    float bk=k*k*uRefr*.22*det*cov;
    tB=mix(tB,t,bk/(length(bend)+bk+1e-4)); bend-=G*bk;
  }

  /* backdrop */
  vec3 bg=mix(cBg1,cBg0,smoothstep(-1.15,1.1,uv0.y+.18*uv0.x));
  vec2 lp=vec2(dot(uL,uCu),dot(uL,uCv));
  bg+=cLight*.1*exp(-dot(uv0-lp*1.2,uv0-lp*1.2)*.5);
  if(tr>.012&&uSh>0.){
    float tb=(uBgZ-dot(ro-uRo,uCw))/dot(rd,uCw);
    float sh=shadow(ro+rd*tb+bend*max(tb-tB,0.),-1.);
    bg=mix(bg,mix(bg*.62,cDeep,.22),sh*uSh*.8);
  }
  col+=tr*bg;
  col*=1.-uVig*dot(uv0*vec2(.55,.75),uv0*vec2(.55,.75))*.4;
  col+=(hash(gl_FragCoord.xy+fract(T)*61.)-.5)*uGrain;
  gl_FragColor=vec4(col,1.);
}
</script>

<script>
const IS_EMBED = document.documentElement.classList.contains('embed');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MAXN = 10;
const STILL = location.search.indexOf('still') > -1;

const S = {
  mode: 'Cascade', family: 'Slabs', count: 5, size: 1, gap: 0.3, rotation: 38, twist: 0, tilt: 6, disorder: 0.15, posX: 0, posY: 0, seed: 7,
  opacity: 0.8, frost: 0.7, lip: 0.085, lipAmt: 1, gloss: 0.9, glow: 0.6, irid: 0, refract: 0.5,
  follow: true, lightAngle: 125, lightHeight: 48, shadow: 0.75, shadowSoft: 0.22, gradient: 1,
  bg0: '#c3d1e3', bg1: '#7f96b3', glassA: '#e4ecf6', glassB: '#a3b9d4', accent: '#3d6fe0', accentShare: 0, deep: '#22395a', light: '#ffffff',
  zoom: 1, lens: 30, yaw: -16, pitch: 24, parallax: 0.6, dof: 0, focus: 0,
  speed: 1, float: 0.5, breathe: 0.5,
  grain: 0.022, vignette: 0.25, render: 1,
};
const PRESETS = {
  'Frost':   { ...S },
  'Fan':     { ...S, mode: 'Stack', family: 'Petals', count: 7, size: 1.05, gap: 0.2, rotation: -8, twist: 5, tilt: 3, posX: -0.25, posY: -0.3, seed: 3,
               opacity: 0.95, frost: 0.3, lip: 0.06, gloss: 1, glow: 0.4, shadow: 0.9, shadowSoft: 0.16,
               bg0: '#d9dcdf', bg1: '#a9adb2', glassA: '#f1f3f5', glassB: '#dfe4ea', deep: '#4b5f7a', yaw: -10, pitch: 16 },
  'Depth':   { ...S, mode: 'Scatter', family: 'Mix', count: 6, size: 1.25, gap: 0.55, rotation: 30, tilt: 22, disorder: 0.6, seed: 33,
               opacity: 0.7, frost: 1, lip: 0.05, gloss: 0.8, shadow: 0.6, shadowSoft: 0.4,
               bg0: '#b4b6cf', bg1: '#8f93b3', glassA: '#e9eaf4', glassB: '#a9aecd', accent: '#27437e', accentShare: 0.25, deep: '#1d2b52',
               zoom: 1.1, yaw: 8, pitch: 10, dof: 0.075, focus: 1.3 },

group('Light', [
  toggle('follow', 'Lamp follows cursor'),
  slider('lightAngle', 'Angle', 0, 360, 1, deg),
  slider('lightHeight', 'Height', 10, 85, 1, deg),
  note('Angle and height apply when the lamp does not follow the cursor.'),
  slider('gradient', 'Face gradient', 0, 2, 0.01),
  slider('shadow', 'Shadows', 0, 1.2, 0.01),
  slider('shadowSoft', 'Shadow softness', 0.02, 0.8, 0.01),
], false);
group('Colour', [
  colorCtl('glassA', 'Glass light'),
  colorCtl('glassB', 'Glass deep'),
  colorCtl('accent', 'Accent'),
  slider('accentShare', 'Accent share', 0, 1, 0.01, v => Math.round(v * 100) + '%'),
  colorCtl('deep', 'Shadow tone'),
  colorCtl('light', 'Lamp'),
  colorCtl('bg0', 'Backdrop top'),
  colorCtl('bg1', 'Backdrop bottom'),
  buttons([['SHUFFLE COLOURS', shuffleColours]]),
], false);
group('Camera', [
  slider('zoom', 'Zoom', 0.5, 2.5, 0.01, v => (+v).toFixed(2) + '×'),
  slider('lens', 'Lens', 12, 70, 1, deg),
  slider('yaw', 'Orbit', -50, 50, 1, deg),
  slider('pitch', 'Pitch', -50, 50, 1, deg),
  slider('parallax', 'Cursor parallax', 0, 2, 0.01),
  slider('dof', 'Depth of field', 0, 0.3, 0.005),
  slider('focus', 'Focus depth', -1.5, 1.5, 0.01),
], false);
group('Motion', [
  slider('speed', 'Speed', 0, 4, 0.05, v => (+v).toFixed(2) + '×'),
  slider('float', 'Float', 0, 2, 0.01),
  slider('breathe', 'Breathe', 0, 2, 0.01),
  note('Shapes ease into every change. Reduced motion shows a still frame.'),
], false);
group('Finish', [
  slider('grain', 'Grain', 0, 0.1, 0.002),
  slider('vignette', 'Vignette', 0, 1, 0.01),
  slider('render', 'Render scale', 0.5, 1, 0.05, v => (+v).toFixed(2) + '×', resize),
], false);

/* presets */
const presetsEl = document.getElementById('presets');
const presetButtons = {};
Object.keys(PRESETS).forEach(name => {
  const b = document.createElement('button'); b.textContent = name;
  b.addEventListener('click', () => applyPreset(name));
  presetsEl.appendChild(b);
  presetButtons[name] = b;
});
function clearPresetActive() { Object.values(presetButtons).forEach(b => b.classList.remove('active')); }
function refreshUi() {
  Object.keys(ui).forEach(k => {
    if (!(k in S)) return;
    const c = ui[k];
    if (c.input.type === 'checkbox') c.input.checked = S[k];
    else if (c.input.type !== 'modes') c.input.value = S[k];
    c.refresh(S[k]);
  });
}
function applyPreset(name) {
  const keep = { render: S.render };
  Object.assign(S, clone(PRESETS[name]), keep);
  refreshUi(); setFg();
  clearPresetActive();
  if (presetButtons[name]) presetButtons[name].classList.add('active');
}

/* randomise */
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const PALETTES = [
  { bg0: '#c3d1e3', bg1: '#7f96b3', glassA: '#e4ecf6', glassB: '#a3b9d4', accent: '#3d6fe0', deep: '#22395a', light: '#ffffff' },
  { bg0: '#d9dcdf', bg1: '#a9adb2', glassA: '#f1f3f5', glassB: '#dfe4ea', accent: '#4e99fb', deep: '#4b5f7a', light: '#ffffff' },
  { bg0: '#b4b6cf', bg1: '#8f93b3', glassA: '#e9eaf4', glassB: '#a9aecd', accent: '#27437e', deep: '#1d2b52', light: '#ffffff' },
  { bg0: '#93aef2', bg1: '#5a7fe6', glassA: '#b9cdfb', glassB: '#3e6cea', accent: '#1f3fd6', deep: '#1730a8', light: '#ffffff' },
  { bg0: '#e3dfe6', bg1: '#c9c7cf', glassA: '#cfe6d6', glassB: '#5fae79', accent: '#1f6b3c', deep: '#12452a', light: '#ffffff' },
  { bg0: '#1a1d21', bg1: '#08090a', glassA: '#59616b', glassB: '#20242a', accent: '#d8ff43', deep: '#050607', light: '#f6ffd9' },
  { bg0: '#f0eff2', bg1: '#d5d6dd', glassA: '#f7f7fa', glassB: '#d7dbe6', accent: '#a098fd', deep: '#5a5f7a', light: '#ffffff' },
  { bg0: '#f3ded2', bg1: '#e0b9a6', glassA: '#fff0e4', glassB: '#f2a47c', accent: '#ff540a', deep: '#6b2a12', light: '#fffaf2' },
  { bg0: '#16233f', bg1: '#070c1a', glassA: '#6f8fd6', glassB: '#1c2f66', accent: '#86f3c3', deep: '#03060f', light: '#dfe9ff' },
  { bg0: '#dfe6e4', bg1: '#b3c4c0', glassA: '#e9f6f3', glassB: '#7fc7bd', accent: '#0f5a46', deep: '#17463f', light: '#ffffff' },
  { bg0: '#2a1f3d', bg1: '#0f0a1a', glassA: '#b8b0fb', glassB: '#4a3a9a', accent: '#ff8a4c', deep: '#07040f', light: '#fff1e6' },
];
function randomise() {
  Object.assign(S, pick(PALETTES));
  const dark = hex(S.bg0)[1] < 0.35;
  S.mode = pick(['Cascade', 'Stack', 'Fan', 'Scatter', 'Scatter']);
  S.family = pick(['Mix', 'Mix', 'Slabs', 'Pills', 'Discs', 'Petals', 'Arches', 'Rings', 'Plus']);
  S.seed = 1 + Math.floor(Math.random() * 9998);
  S.count = Math.round(rnd(3, 8)); S.size = +rnd(0.8, 1.3).toFixed(2); S.gap = +rnd(0.18, 0.5).toFixed(2);
  S.rotation = Math.round(rnd(-180, 180));
  S.twist = S.mode === 'Fan' ? +rnd(9, 24).toFixed(1) * pick([-1, 1]) : S.mode === 'Stack' ? +rnd(-9, 9).toFixed(1) : +rnd(-3, 3).toFixed(1);
  S.tilt = Math.round(S.mode === 'Scatter' ? rnd(8, 32) : rnd(0, 10)); S.disorder = +(S.mode === 'Scatter' ? rnd(0.3, 0.8) : rnd(0, 0.25)).toFixed(2);
  S.posX = +rnd(-0.3, 0.3).toFixed(2); S.posY = +rnd(-0.35, 0.25).toFixed(2);
  S.opacity = +rnd(dark ? 0.5 : 0.62, 0.95).toFixed(2); S.frost = +rnd(0.3, 1.1).toFixed(2);
  S.lip = +rnd(0.04, 0.12).toFixed(3); S.lipAmt = +rnd(0.7, 1.2).toFixed(2); S.gloss = +rnd(0.6, 1.3).toFixed(2); S.glow = +rnd(0.3, 1.1).toFixed(2);
  S.irid = Math.random() < 0.3 ? +rnd(0.3, 0.9).toFixed(2) : 0; S.refract = +rnd(0.2, 1.1).toFixed(2);
  S.follow = true; S.lightAngle = Math.round(rnd(0, 360)); S.lightHeight = Math.round(rnd(30, 65));
  S.gradient = +rnd(0.6, 1.4).toFixed(2); S.shadow = +rnd(0.5, 1).toFixed(2); S.shadowSoft = +rnd(0.14, 0.4).toFixed(2);
  S.accentShare = Math.random() < 0.55 ? +rnd(0.15, 0.4).toFixed(2) : 0;
  S.zoom = +rnd(0.9, 1.4).toFixed(2); S.lens = Math.round(rnd(22, 42)); S.yaw = Math.round(rnd(-22, 22)); S.pitch = Math.round(rnd(6, 28));
  S.dof = Math.random() < 0.35 ? +rnd(0.03, 0.12).toFixed(3) : 0; S.focus = +rnd(0, 0.8).toFixed(2);
  S.float = +rnd(0.3, 0.9).toFixed(2); S.breathe = +rnd(0.2, 0.9).toFixed(2); S.speed = +rnd(0.7, 1.5).toFixed(2);
  S.grain = +rnd(0.012, 0.035).toFixed(3); S.vignette = +rnd(0.1, dark ? 0.6 : 0.35).toFixed(2);
  refreshUi(); setFg(); clearPresetActive();
}

/* panel show/hide, buttons, keys */
document.getElementById('hideUi').addEventListener('click', () => panel.classList.add('hidden'));
document.getElementById('toggleUi').addEventListener('click', () => panel.classList.remove('hidden'));
document.getElementById('randomBtn').addEventListener('click', randomise);
document.getElementById('exportBtn').addEventListener('click', () => exportPNG(2));
const toast = document.getElementById('toast');
function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1800); }
document.getElementById('copyBtn').addEventListener('click', async () => {
  const json = JSON.stringify(S, null, 2);
  try { await navigator.clipboard.writeText(json); showToast('Settings copied as JSON'); }
  catch (e) { showToast('Clipboard blocked by the browser'); }
});
addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space') { if (tag === 'BUTTON') return; e.preventDefault(); newShapes(); }
  else if (e.key === 'r') randomise();
  else if (e.key === 'h') panel.classList.toggle('hidden');
});

/* ============================== boot ============================== */
const q = new URLSearchParams(location.search);
if (!gl) showToast('WebGL is off in this browser');
applyPreset(q.get('preset') && PRESETS[q.get('preset')] ? q.get('preset') : 'Frost');
stepShapes(T, RM || STILL ? 1 : 0);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
