<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>013 · Iron Filings — StanVision Lab</title>
<meta name="description" content="Thousands of needles aligning to a magnetic field you drag around: pole, dipole, vortex or the StanVision + as the magnet. Filing, compass and dash needles, brand colourways, PNG export. A StanVision Lab experiment.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ink:#0a0a0b;
    --panel:rgba(13,17,23,.86);
    --line:rgba(148,163,184,.16);
    --text:#e6ebf2;
    --mute:#8a94a3;
    --accent:#d8ff43;
    --radius:10px;
  }
  html,body{height:100%;}
  body{
    margin:0; background:var(--ink); color:var(--text);
    font-family:"Archivo",system-ui,-apple-system,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed; inset:0;}
  #glow{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    pointer-events:none; border-radius:50%; filter:blur(2px);}
  canvas{display:block; cursor:grab;}
  canvas.dragging{cursor:grabbing;}

  header{
    position:fixed; top:20px; left:24px; z-index:5; pointer-events:none;
  }
  header h1{
    margin:0; font-size:14px; font-weight:600; letter-spacing:.02em;
  }
  header p{
    margin:4px 0 0; font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:11px; letter-spacing:.04em;
  }
  header{color:var(--pagefg,#e6ebf2);}
  header p{opacity:.55;}

  #panel{
    position:fixed; top:16px; right:16px; bottom:16px; width:288px; z-index:6;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    display:flex; flex-direction:column; overflow:hidden;
    transition:transform .28s cubic-bezier(.4,0,.2,1), opacity .28s;
  }
  #panel.hidden{transform:translateX(calc(100% + 24px)); opacity:0; pointer-events:none;}
  #panel .head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px 12px; border-bottom:1px solid var(--line);
  }
  #panel .head span{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px;
    letter-spacing:.12em; text-transform:uppercase; color:var(--mute);
  }
  #panel .body{overflow-y:auto; padding:6px 16px 16px; flex:1; scrollbar-width:thin; scrollbar-color:rgba(148,163,184,.3) transparent;}
  #panel .body::-webkit-scrollbar{width:6px;}
  #panel .body::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25); border-radius:3px;}

  .presets{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:14px 0 4px;}
  .presets button{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.03em;
    color:var(--text); background:rgba(148,163,184,.08); border:1px solid var(--line);
    border-radius:8px; padding:8px 6px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .presets button:hover{border-color:rgba(148,163,184,.45);}
  .presets button.active{border-color:var(--accent); background:rgba(216,255,67,.14);}

  details{border-bottom:1px solid var(--line); padding:2px 0;}
  details:last-of-type{border-bottom:none;}
  summary{
    list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between;
    padding:12px 2px; font-size:12px; font-weight:600; letter-spacing:.02em; user-select:none;
  }
  summary::-webkit-details-marker{display:none;}
  summary::after{content:""; width:7px; height:7px; border-right:1.4px solid var(--mute);
    border-bottom:1.4px solid var(--mute); transform:rotate(45deg); transition:transform .18s; margin-right:3px;}
  details[open] summary::after{transform:rotate(-135deg); margin-top:4px;}
  .grp{padding:0 2px 14px; display:flex; flex-direction:column; gap:11px;}

  .row{display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:22px;}
  .row label{font-size:12px; color:var(--mute); flex:0 0 auto;}
  .row .val{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px; color:var(--text);
    min-width:38px; text-align:right; font-variant-numeric:tabular-nums;
  }
  .slider-row{display:flex; flex-direction:column; gap:6px;}
  .slider-row .top{display:flex; justify-content:space-between; align-items:baseline;}
  .slider-row .top label{font-size:12px; color:var(--mute);}
  .slider-row .top .val{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px; color:var(--text);
    font-variant-numeric:tabular-nums;
  }

  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:18px; background:transparent; cursor:pointer; margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{height:2px; background:rgba(148,163,184,.28); border-radius:1px;}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:12px; height:12px; border-radius:50%;
    background:var(--text); margin-top:-5px; border:none;
    transition:transform .12s; box-shadow:0 0 0 3px rgba(5,7,11,.6);
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15);}
  input[type=range]::-moz-range-track{height:2px; background:rgba(148,163,184,.28); border-radius:1px;}
  input[type=range]::-moz-range-thumb{width:12px; height:12px; border-radius:50%; background:var(--text); border:none;}

  input[type=color]{
    -webkit-appearance:none; appearance:none; width:44px; height:22px; border:1px solid var(--line);
    border-radius:6px; background:none; padding:0; cursor:pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:2px;}
  input[type=color]::-webkit-color-swatch{border:none; border-radius:4px;}
  input[type=color]::-moz-color-swatch{border:none; border-radius:4px;}

  .switch{position:relative; width:32px; height:18px; flex:0 0 auto;}
  .switch input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer;}
  .switch i{
    position:absolute; inset:0; border-radius:9px; background:rgba(148,163,184,.25);
    transition:background .18s; pointer-events:none;
  }
  .switch i::after{
    content:""; position:absolute; left:2px; top:2px; width:14px; height:14px; border-radius:50%;
    background:var(--text); transition:transform .18s, background .18s;
  }
  .switch input:checked + i{background:var(--accent);}
  .switch input:checked + i::after{transform:translateX(14px); background:#0f1409;}

  .footbar{
    border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:8px;
  }
  .footbar button{
    flex:1; font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.04em;
    color:#0a0605; background:var(--text); border:none; border-radius:8px; padding:9px 0; cursor:pointer;
    transition:opacity .15s;
  }
  .footbar button:hover{opacity:.85;}

  #toggleUi{
    position:fixed; top:24px; right:16px; z-index:7; width:34px; height:34px;
    border-radius:9px; border:1px solid var(--line); background:var(--panel);
    backdrop-filter:blur(14px); color:var(--mute); cursor:pointer; font-size:15px; line-height:1;
    display:none; align-items:center; justify-content:center;
  }
  #panel.hidden ~ #toggleUi{display:flex;}

  #toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,12px); z-index:9;
    background:var(--text); color:#0a0605; font-size:12px; font-weight:500;
    padding:8px 14px; border-radius:8px; opacity:0; transition:opacity .2s, transform .2s;
    pointer-events:none;
  }
  #toast.show{opacity:1; transform:translate(-50%,0);}

  .hidebtn{background:none; border:none; color:var(--mute); font-size:15px; cursor:pointer; padding:2px 4px; line-height:1;}
  .hidebtn:hover{color:var(--text);}

  @media (max-width:720px){
    #panel{top:auto; left:12px; right:12px; bottom:12px; width:auto; max-height:46vh;}
    #panel.hidden{transform:translateY(calc(100% + 20px));}
    header{left:16px; top:16px;}
    #toggleUi{top:auto; bottom:20px;}
  }
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

  /* lab header conventions */
  header{pointer-events:none;}
  header a.lab-back{
    pointer-events:auto; color:var(--text); text-decoration:none;
    display:flex; align-items:center; gap:10px;
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; letter-spacing:.04em;
  }
  header a.lab-back .idx{color:#d8ff43;}
  header a.lab-back:hover .lbl{text-decoration:underline; text-underline-offset:3px;}
  html.embed header, html.embed #panel, html.embed #toggleUi, html.embed #toast{display:none !important;}
  /* iron filings additions */
  #stage{position:fixed; inset:0;}
  #stage canvas{display:block; width:100%; height:100%; cursor:crosshair;}
  .sect{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--mute); padding:14px 2px 0;
  }
  .modes{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:8px 0 4px;}
  .modes.c2{grid-template-columns:repeat(2,1fr);}
  .modes.c4{grid-template-columns:repeat(4,1fr);}
  .modes.c4 button{padding:7px 0; font-size:10.5px; letter-spacing:.01em;}
  .modes.c5{grid-template-columns:repeat(5,1fr);}
  .modes.c5 button{padding:7px 0; font-size:10px; letter-spacing:0;}
  .modes button{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.03em;
    color:var(--text); background:rgba(148,163,184,.08); border:1px solid var(--line);
    border-radius:8px; padding:7px 4px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .modes button:hover{border-color:rgba(148,163,184,.45);}
  .modes button.active{border-color:var(--accent); background:rgba(216,255,67,.14);}
  .btnrow{display:flex; gap:8px;}
  .btnrow button{
    flex:1; font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.03em;
    color:var(--text); background:rgba(148,163,184,.08); border:1px solid var(--line);
    border-radius:8px; padding:8px 6px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .btnrow button:hover{border-color:rgba(148,163,184,.45);}
  .btnrow button:active{background:rgba(216,255,67,.14); border-color:var(--accent);}
  .btnrow.trig{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  .swatches{display:flex; gap:6px; padding:4px 0 2px; flex-wrap:wrap;}
  .swatches button{width:26px; height:22px; border-radius:6px; border:1px solid var(--line); cursor:pointer; padding:0; position:relative; overflow:hidden;}
  .swatches button i{position:absolute; left:50%; top:50%; width:6px; height:6px; transform:translate(-50%,-50%); border-radius:1px;}
  .swatches button:hover{border-color:rgba(148,163,184,.6);}
  .footbar button{font-size:10px; letter-spacing:.02em; white-space:nowrap; padding:9px 0;}
  .sub{display:flex; flex-direction:column; gap:11px;}
  .sub[hidden]{display:none;}
  .note{margin:0; font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px; line-height:1.5; color:var(--mute);}
  .note code{color:var(--text);}
  #hint{
    position:fixed; left:24px; bottom:22px; z-index:5; pointer-events:none;
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.04em;
    color:var(--pagefg,#e6ebf2); opacity:.5;
  }
  html.embed #hint{display:none !important;}
  @media (max-width:720px){ #hint{display:none;} }
</style>
</head>
<body>
<script>if(location.search.indexOf('embed')>-1)document.documentElement.classList.add('embed');</script>
<div id="stage"><canvas id="cv"></canvas></div>

<header>
  <a class="lab-back" href="/"><span class="idx">013</span><span class="lbl">Iron Filings</span></a>
  <p>StanVision Lab — Canvas / magnetic field</p>
</header>
<div id="hint">move the cursor · click = flip polarity · space = pulse · r = random · h = hide panel</div>

<aside id="panel">
  <div class="head">
    <span>Controls</span>
    <button class="hidebtn" id="hideUi" title="Hide panel" aria-label="Hide panel">&times;</button>
  </div>
  <div class="body">
    <div class="presets" id="presets"></div>
    <div id="groups"></div>
  </div>
  <div class="footbar">
    <button id="exportBtn" class="secondary">EXPORT PNG</button>
    <button id="randomBtn" class="secondary">RANDOMISE</button>
    <button id="copyBtn">COPY SETTINGS</button>
  </div>
</aside>
<button id="toggleUi" title="Show controls" aria-label="Show controls">☰</button>

<div id="toast">Copied to clipboard</div>

<script>
const IS_EMBED = document.documentElement.classList.contains('embed');
const MODES = ['Pole', 'Dipole', 'Vortex', 'Plus'];
const GRIDS = ['Square', 'Hex', 'Scatter'];
const STYLES = ['Filing', 'Compass', 'Dash'];

const S = {
  mode: 'Dipole', polarity: 1, dipAngle: 0, alignMotion: true, plusSize: 0.3, plusRot: 0,
  reach: 0.3, falloff: 2.2, poles: 0, polesDrift: true,
  grid: 'Square', spacing: 18, style: 'Filing', len: 0.8, thick: 1.3, lenBy: 0.55, minAlpha: 0.3, jitter: 0.12,
  ease: 0.14, follow: 0.16, flowAmt: 0.35, flowScale: 1.6, flowSpeed: 0.3, baseAngle: 0,
  bg: '#0a0a0b', low: '#2c323b', high: '#d8ff43', poleMark: false,
};
const PRESETS = {
  Filings: { ...S },
  Iron:    { ...S, mode: 'Pole', bg: '#0e1020', low: '#283052', high: '#8fb8ff', spacing: 20, len: 0.85, thick: 1.2, lenBy: 0.7, flowAmt: 0.25, jitter: 0.05, ease: 0.1 },
  Compass: { ...S, mode: 'Pole', style: 'Compass', grid: 'Hex', spacing: 26, len: 0.72, thick: 2.2, lenBy: 0.3, bg: '#0d0d0d', low: '#3a3533', high: '#ff540a', minAlpha: 0.45, jitter: 0.02, flowAmt: 0.15, poleMark: true },
  Plus:    { ...S, mode: 'Plus', spacing: 14, len: 0.9, thick: 1.1, lenBy: 0.75, plusSize: 0.42, reach: 0.22, falloff: 1.6, minAlpha: 0.18, flowAmt: 0.3, follow: 0.1 },
  Vortex:  { ...S, mode: 'Vortex', grid: 'Scatter', spacing: 16, bg: '#0d0d0d', low: '#2d2a4a', high: '#a098fd', reach: 0.36, falloff: 1.6, poles: 2, lenBy: 0.8, jitter: 0.2 },
  Paper:   { ...S, mode: 'Dipole', style: 'Dash', spacing: 22, len: 0.55, thick: 2.6, lenBy: 0.6, bg: '#f9faf7', low: '#d4d7d0', high: '#0d0d0d', minAlpha: 0.55, flowAmt: 0.2, jitter: 0.08 },
};
const clone = o => JSON.parse(JSON.stringify(o));
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixHex = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };

/* ============================== canvas ============================== */
const cvs = document.getElementById('cv');
const ctx = cvs.getContext('2d', { alpha: false });
const DPR = Math.min(devicePixelRatio || 1, 2);
let W = innerWidth, H = innerHeight;
function setFg(){
  const c = hex(S.bg); const lum = (.2126 * c[0] + .7152 * c[1] + .0722 * c[2]) / 255;
  document.documentElement.style.setProperty('--pagefg', lum > 0.55 ? '#14161a' : '#e6ebf2');
  document.body.style.background = S.bg;
}

/* needles: x, y, vx, vy (eased direction), s (eased strength), cj/sj (jitter rotation), seed */
let N = 0, X, Y, VX, VY, SV, CJ, SJ;
function buildGrid(){
  W = innerWidth; H = innerHeight;
  let sp = S.spacing;
  while ((W / sp) * (H / sp) > 16000) sp *= 1.1;
  const pts = [];
  const rowH = S.grid === 'Hex' ? sp * 0.866 : sp;
  const cols = Math.ceil(W / sp) + 2, rows = Math.ceil(H / rowH) + 2;
  let seed = 1234567;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    let x = (c - 0.5) * sp, y = (r - 0.5) * rowH;
    if (S.grid === 'Hex' && r % 2) x += sp / 2;
    if (S.grid === 'Scatter') { x += (rand() - .5) * sp * 0.9; y += (rand() - .5) * sp * 0.9; }
    pts.push(x, y);
  }
  N = pts.length / 2;
  X = new Float32Array(N); Y = new Float32Array(N); VX = new Float32Array(N); VY = new Float32Array(N);
  SV = new Float32Array(N); CJ = new Float32Array(N); SJ = new Float32Array(N);
  const ba = S.baseAngle * Math.PI / 180;
  for (let i = 0; i < N; i++) {
    X[i] = pts[i * 2]; Y[i] = pts[i * 2 + 1];
    VX[i] = Math.cos(ba); VY[i] = Math.sin(ba);
    const a = (rand() - .5) * 2; CJ[i] = a; SJ[i] = rand();
  }
}
function resize(){
  W = innerWidth; H = innerHeight;
  cvs.width = Math.floor(W * DPR); cvs.height = Math.floor(H * DPR);
  buildGrid();
}
addEventListener('resize', resize);

/* ============================== poles & pointer ============================== */
const pole = { x: innerWidth * .4, y: innerHeight * .5, tx: innerWidth * .4, ty: innerHeight * .5, ang: 0, vx: 0, vy: 0 };
let lastMove = -1e9, pointerIn = false;
const panelOpen = () => !document.getElementById('panel').classList.contains('hidden') && innerWidth > 720 && !IS_EMBED;
const centreX = () => W / 2 - (panelOpen() ? 160 : 0);
addEventListener('pointermove', e => {
  if (e.target.closest && e.target.closest('#panel')) return;
  pole.tx = e.clientX; pole.ty = e.clientY; lastMove = performance.now(); pointerIn = true;
});
document.addEventListener('pointerleave', () => { pointerIn = false; });
cvs.addEventListener('pointerdown', () => { S.polarity *= -1; flash = Math.max(flash, .5); });

/* extra fixed poles, seeded, alternating sign */
let extra = [];
let poleSeed = 7;
function seedPoles(){
  let s = poleSeed * 9301 + 49297;
  const rand = () => (s = (s * 16807) % 2147483647) / 2147483647;
  extra = [];
  for (let i = 0; i < 4; i++) extra.push({ u: .12 + rand() * .76, v: .14 + rand() * .72, ph: rand() * 6.28, sp: .15 + rand() * .25, sign: i % 2 ? 1 : -1, ang: rand() * 6.28 });
}
seedPoles();

/* pulses (space) */
let pulses = [], flash = 0;
function pulse(){ pulses.push({ x: pole.x, y: pole.y, t: 0 }); flash = 1; }

/* ============================== field ============================== */
let plusW = 0, plusC = 1, plusS = 0;
function boxSd(px, py, bx, by){
  const dx = Math.abs(px) - bx, dy = Math.abs(py) - by;
  const ox = Math.max(dx, 0), oy = Math.max(dy, 0);
  return Math.sqrt(ox * ox + oy * oy) + Math.min(Math.max(dx, dy), 0);
}
function plusSd(x, y){
  const lx = x * plusC + y * plusS, ly = -x * plusS + y * plusC;
  const w = plusW;
  const a = Math.min(boxSd(lx, ly, 1.5 * w, .5 * w), boxSd(lx, ly, .5 * w, 1.5 * w));
  return Math.max(a, -boxSd(lx, ly, .375 * w, .375 * w));
}
/* accumulates into F (field vector) and returns pole strength 0..1 */
const F = [0, 0];
function poleField(px, py, x, y, kind, sign, ang, R, fo){
  const dx = x - px, dy = y - py;
  const d = Math.sqrt(dx * dx + dy * dy) + 1e-4;
  const q = d / R;
  const f = 1 / (1 + Math.pow(q, fo));
  const rx = dx / d, ry = dy / d;
  if (kind === 'Pole') { F[0] += rx * f * sign; F[1] += ry * f * sign; return f; }
  if (kind === 'Vortex') { F[0] += -ry * f * sign; F[1] += rx * f * sign; return f; }
  /* dipole: 3(m·r)r - m */
  const mx = Math.cos(ang) * sign, my = Math.sin(ang) * sign;
  const md = mx * rx + my * ry;
  const bx = 3 * md * rx - mx, by = 3 * md * ry - my;
  const g = f * 0.6;
  F[0] += bx * g; F[1] += by * g;
  return Math.min(1, f * (0.6 + 0.6 * Math.abs(md)));
}

/* ============================== frame ============================== */
let last = performance.now(), T = 0;
function step(dt){
  T += dt * S.flowSpeed;
  const now = performance.now();
  const idle = IS_EMBED || now - lastMove > 2500 || !pointerIn;
  if (idle) {
    const t = now / 1000 * .35;
    pole.tx = centreX() + Math.sin(t) * W * .26;
    pole.ty = H / 2 + Math.sin(t * 2) * H * .17;
  }
  const kf = 1 - Math.pow(1 - S.follow, dt * 60);
  const ox = pole.x, oy = pole.y;
  pole.x += (pole.tx - pole.x) * kf; pole.y += (pole.ty - pole.y) * kf;
  pole.vx = pole.vx * .85 + (pole.x - ox) * .15; pole.vy = pole.vy * .85 + (pole.y - oy) * .15;
  const sp = Math.hypot(pole.vx, pole.vy);
  let target = S.dipAngle * Math.PI / 180;
  if (S.alignMotion && sp > .25) target = Math.atan2(pole.vy, pole.vx);
  if (S.alignMotion && sp <= .25) target = pole.ang;
  let da = target - pole.ang; da = Math.atan2(Math.sin(da), Math.cos(da));
  pole.ang += da * Math.min(1, .08 * dt * 60);
  if (!S.alignMotion) pole.ang = target;

  flash *= Math.pow(.93, dt * 60);
  pulses.forEach(p => p.t += dt); pulses = pulses.filter(p => p.t < 2.2);

  const M = Math.min(W, H);
  const R = S.reach * M, fo = S.falloff;
  plusW = S.plusSize * M / 3;
  const pr = S.plusRot * Math.PI / 180; plusC = Math.cos(pr); plusS = Math.sin(pr);
  const ba = S.baseAngle * Math.PI / 180;
  const fs = S.flowScale / M * 4;
  const baseMag = 0.06 + S.flowAmt * 0.22;
  const ke = 1 - Math.pow(1 - S.ease, dt * 60);
  const axial = S.style !== 'Compass';
  const jit = S.jitter * 0.9;
  const ex = [];
  if (S.mode !== 'Plus') for (let k = 0; k < S.poles; k++) {
    const e = extra[k], tt = now / 1000 * (S.polesDrift ? e.sp : 0);
    ex.push([W * (e.u + Math.sin(tt + e.ph) * .06), H * (e.v + Math.cos(tt * 1.3 + e.ph) * .06), e.sign * S.polarity, e.ang + tt]);
  }
  const pw = []; pulses.forEach(p => pw.push([p.x, p.y, p.t * M * 0.75, Math.max(0, 1 - p.t / 2.2)]));
  const sign = S.polarity, pang = pole.ang;
  const plusFall = Math.max(3, plusW * S.reach * 0.8);

  for (let i = 0; i < N; i++) {
    const x = X[i], y = Y[i];
    F[0] = 0; F[1] = 0;
    let s = 0;
    if (S.mode === 'Plus') {
      const lx = x - pole.x, ly = y - pole.y;
      const d0 = plusSd(lx, ly), e = 1.5;
      const gx = plusSd(lx + e, ly) - plusSd(lx - e, ly), gy = plusSd(lx, ly + e) - plusSd(lx, ly - e);
      const gl = Math.hypot(gx, gy) + 1e-5;
      const f = d0 < 0 ? 1 : 1 / (1 + Math.pow(d0 / plusFall, fo));
      F[0] = -gy / gl * f * sign; F[1] = gx / gl * f * sign;
      s = f;
    } else {
      s = poleField(pole.x, pole.y, x, y, S.mode, sign, pang, R, fo);
      for (let k = 0; k < ex.length; k++) s += 0.7 * poleField(ex[k][0], ex[k][1], x, y, S.mode, ex[k][2], ex[k][3], R * .7, fo);
    }
    /* pulse rings: tangential kick */
    for (let k = 0; k < pw.length; k++) {
      const p = pw[k], dx = x - p[0], dy = y - p[1], d = Math.hypot(dx, dy) + 1e-4;
      const band = Math.exp(-Math.pow((d - p[2]) / (M * .05), 2)) * p[3];
      if (band > .01) { F[0] += -dy / d * band * 2; F[1] += dx / d * band * 2; s += band; }
    }
    /* ambient flow */
    const n = Math.sin(x * fs + T * 1.3) * Math.cos(y * fs * 1.2 - T) + Math.sin((x + y) * fs * .6 + T * .7) * .6;
    const a = ba + n * S.flowAmt * 1.6;
    F[0] += Math.cos(a) * baseMag; F[1] += Math.sin(a) * baseMag;
    /* jitter rotation */
    let tx = F[0], ty = F[1];
    const tl = Math.hypot(tx, ty) + 1e-6; tx /= tl; ty /= tl;
    if (jit) { const r = CJ[i] * jit, c = Math.cos(r), sn = Math.sin(r); const nx = tx * c - ty * sn; ty = tx * sn + ty * c; tx = nx; }
    /* axial filings always turn the short way */
    if (axial && tx * VX[i] + ty * VY[i] < 0) { tx = -tx; ty = -ty; }
    let vx = VX[i] + (tx - VX[i]) * ke, vy = VY[i] + (ty - VY[i]) * ke;
    const vl = Math.hypot(vx, vy) + 1e-6;
    VX[i] = vx / vl; VY[i] = vy / vl;
    s = Math.min(1, s + flash * .25);
    SV[i] += (s - SV[i]) * ke;
  }
}

const LEVELS = 10;
function draw(c, w, h){
  c.fillStyle = S.bg; c.fillRect(0, 0, w, h);
  const L = S.spacing * S.len * .5;
  const minL = 1 - S.lenBy;
  const comp = S.style === 'Compass';
  c.lineCap = S.style === 'Dash' ? 'round' : (comp ? 'round' : 'butt');
  const paths = [];
  for (let l = 0; l < LEVELS; l++) paths.push(new Path2D());
  const back = comp ? new Path2D() : null;
  for (let i = 0; i < N; i++) {
    const s = SV[i];
    const lv = Math.min(LEVELS - 1, Math.floor(s * LEVELS));
    const hl = L * (minL + (1 - minL) * Math.min(1, s * 1.15));
    const dx = VX[i] * hl, dy = VY[i] * hl, x = X[i], y = Y[i];
    if (comp) { paths[lv].moveTo(x, y); paths[lv].lineTo(x + dx, y + dy); back.moveTo(x, y); back.lineTo(x - dx, y - dy); }
    else { paths[lv].moveTo(x - dx, y - dy); paths[lv].lineTo(x + dx, y + dy); }
  }
  if (comp) { c.strokeStyle = S.low; c.globalAlpha = 1; c.lineWidth = S.thick; c.stroke(back); }
  for (let l = 0; l < LEVELS; l++) {
    const t = l / (LEVELS - 1);
    c.strokeStyle = mixHex(S.low, S.high, Math.pow(t, 1.2));
    c.globalAlpha = S.minAlpha + (1 - S.minAlpha) * t;
    c.lineWidth = S.thick * (0.85 + 0.3 * t);
    c.stroke(paths[l]);
  }
  c.globalAlpha = 1;
  if (S.poleMark && !IS_EMBED) {
    c.strokeStyle = S.high; c.lineWidth = 1.2; c.globalAlpha = .9;
    c.beginPath(); c.arc(pole.x, pole.y, 9, 0, Math.PI * 2); c.stroke();
    if (S.polarity > 0) { c.beginPath(); c.moveTo(pole.x - 4, pole.y); c.lineTo(pole.x + 4, pole.y); c.moveTo(pole.x, pole.y - 4); c.lineTo(pole.x, pole.y + 4); c.stroke(); }
    else { c.beginPath(); c.moveTo(pole.x - 4, pole.y); c.lineTo(pole.x + 4, pole.y); c.stroke(); }
    c.globalAlpha = 1;
  }
}

function frame(){
  const now = performance.now();
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  step(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  draw(ctx, W, H);
  requestAnimationFrame(frame);
}

function exportPNG(scale){
  const c = document.createElement('canvas');
  c.width = Math.round(W * scale); c.height = Math.round(H * scale);
  const x = c.getContext('2d'); x.setTransform(scale, 0, 0, scale, 0, 0);
  draw(x, W, H);
  const a = document.createElement('a'); a.download = 'iron-filings-' + c.width + 'x' + c.height + '.png';
  a.href = c.toDataURL('image/png'); a.click();
  showToast('PNG exported at ' + c.width + '×' + c.height);
}

/* ============================== panel ============================== */
const ui = {};
const groupsEl = document.getElementById('groups');
function slider(key, label, min, max, step, fmt, onChange) {
  const wrap = document.createElement('div');
  wrap.className = 'slider-row';
  const top = document.createElement('div'); top.className = 'top';
  const lab = document.createElement('label'); lab.textContent = label;
  const val = document.createElement('span'); val.className = 'val';
  top.append(lab, val);
  const input = document.createElement('input');
  input.type = 'range'; input.min = min; input.max = max; input.step = step; input.value = S[key];
  const refresh = v => { val.textContent = fmt ? fmt(v) : (+v).toFixed(step < 1 ? (step < 0.1 ? (step < 0.01 ? 3 : 2) : 1) : 0); };
  refresh(S[key]);
  input.addEventListener('input', () => {
    S[key] = +input.value; refresh(S[key]); onChange && onChange(S[key]); clearPresetActive();
  });
  wrap.append(top, input);
  ui[key] = { input, refresh };
  return wrap;
}
function colorCtl(key, label, onChange) {
  const row = document.createElement('div'); row.className = 'row';
  const lab = document.createElement('label'); lab.textContent = label;
  const input = document.createElement('input'); input.type = 'color'; input.value = S[key];
  input.addEventListener('input', () => { S[key] = input.value; onChange && onChange(S[key]); clearPresetActive(); });
  row.append(lab, input);
  ui[key] = { input, refresh: () => {} };
  return row;
}
function toggle(key, label, onChange) {
  const row = document.createElement('div'); row.className = 'row';
  const lab = document.createElement('label'); lab.textContent = label;
  const sw = document.createElement('span'); sw.className = 'switch';
  const input = document.createElement('input'); input.type = 'checkbox'; input.checked = S[key];
  const i = document.createElement('i');
  sw.append(input, i);
  input.addEventListener('change', () => { S[key] = input.checked; onChange && onChange(S[key]); clearPresetActive(); });
  row.append(lab, sw);
  ui[key] = { input, refresh: () => {} };
  return row;
}
function modes(key, options, onChange, cls) {
  const wrap = document.createElement('div'); wrap.className = 'modes' + (cls ? ' ' + cls : '');
  const btns = {};
  options.forEach(o => {
    const b = document.createElement('button'); b.textContent = o;
    b.addEventListener('click', () => { S[key] = o; refresh(); onChange && onChange(o); clearPresetActive(); });
    wrap.appendChild(b); btns[o] = b;
  });
  const refresh = () => Object.keys(btns).forEach(o => btns[o].classList.toggle('active', S[key] === o));
  refresh();
  ui[key] = { input: { type: 'modes' }, refresh };
  return wrap;
}
function sect(title) { const d = document.createElement('div'); d.className = 'sect'; d.textContent = title; return d; }
function note(html) { const p = document.createElement('p'); p.className = 'note'; p.innerHTML = html; return p; }
function buttons(list, cls) {
  const row = document.createElement('div'); row.className = 'btnrow' + (cls ? ' ' + cls : '');
  list.forEach(([label, fn]) => { const b = document.createElement('button'); b.textContent = label; b.addEventListener('click', fn); row.appendChild(b); });
  return row;
}
function sub(items) { const d = document.createElement('div'); d.className = 'sub'; items.forEach(i => d.appendChild(i)); return d; }
function group(title, items, open = true) {
  const det = document.createElement('details'); det.open = open;
  const sum = document.createElement('summary'); sum.textContent = title;
  const grp = document.createElement('div'); grp.className = 'grp';
  items.forEach(i => grp.appendChild(i));
  det.append(sum, grp);
  groupsEl.appendChild(det);
}
const BRAND = [['Lime', '#d8ff43'], ['Orange', '#ff540a'], ['Lilac', '#a098fd'], ['Blue', '#4e99fb'], ['Mint', '#86f3c3'], ['Paper', '#f9faf7'], ['Ink', '#0d0d0d']];
function swatches(key){
  const row = document.createElement('div'); row.className = 'swatches';
  BRAND.forEach(([name, c]) => {
    const b = document.createElement('button'); b.title = name + ' ' + c; b.style.background = c;
    b.addEventListener('click', () => { S[key] = c; ui[key].input.value = c; if (key === 'bg') setFg(); clearPresetActive(); });
    row.appendChild(b);
  });
  return row;
}

const subs = {};
subs.dip = sub([
  toggle('alignMotion', 'Align to motion'),
  slider('dipAngle', 'Axis', -180, 180, 1, v => Math.round(v) + '°'),
]);
subs.plus = sub([
  slider('plusSize', 'Plus size', 0.1, 0.8, 0.01),
  slider('plusRot', 'Plus rotation', -45, 45, 1, v => Math.round(v) + '°'),
]);
subs.poles = sub([
  slider('poles', 'Extra poles', 0, 4, 1),
  toggle('polesDrift', 'Poles drift'),
  buttons([['NEW POLES', () => { poleSeed = Math.floor(Math.random() * 1e6); seedPoles(); }]]),
]);
function showSub(){
  subs.dip.hidden = S.mode !== 'Dipole';
  subs.plus.hidden = S.mode !== 'Plus';
  subs.poles.hidden = S.mode === 'Plus';
}

group('Field', [
  modes('mode', MODES, showSub, 'c4'),
  subs.dip, subs.plus,
  slider('reach', 'Reach', 0.05, 0.8, 0.01),
  slider('falloff', 'Falloff', 0.8, 5, 0.1),
  subs.poles,
  note('Click the canvas to flip polarity. Compass needles show it; filings are headless.'),
], true);
group('Needles', [
  modes('style', STYLES, null),
  modes('grid', GRIDS, buildGrid),
  slider('spacing', 'Spacing', 8, 48, 1, v => v + ' px', buildGrid),
  slider('len', 'Length', 0.2, 1.6, 0.01),
  slider('thick', 'Thickness', 0.5, 5, 0.1, v => (+v).toFixed(1) + ' px'),
  slider('lenBy', 'Length by strength', 0, 1, 0.01),
  slider('jitter', 'Jitter', 0, 1, 0.01),
], true);
group('Motion', [
  slider('follow', 'Pole follow', 0.02, 0.6, 0.01),
  slider('ease', 'Needle easing', 0.02, 0.6, 0.01),
  slider('flowAmt', 'Ambient flow', 0, 1, 0.01),
  slider('flowScale', 'Flow scale', 0.3, 5, 0.1),
  slider('flowSpeed', 'Flow speed', 0, 2, 0.01),
  slider('baseAngle', 'Rest angle', -90, 90, 1, v => Math.round(v) + '°', buildGrid),
  buttons([['PULSE', pulse]]),
], false);
group('Colour', [
  colorCtl('bg', 'Background', setFg), swatches('bg'),
  colorCtl('low', 'Weak field'), swatches('low'),
  colorCtl('high', 'Strong field'), swatches('high'),
  slider('minAlpha', 'Weak opacity', 0, 1, 0.01),
  toggle('poleMark', 'Show pole'),
], false);

/* presets */
const presetsEl = document.getElementById('presets');
const presetButtons = {};
Object.keys(PRESETS).forEach(name => {
  const b = document.createElement('button'); b.textContent = name;
  b.addEventListener('click', () => applyPreset(name));
  presetsEl.appendChild(b);
  presetButtons[name] = b;
});
function clearPresetActive() { Object.values(presetButtons).forEach(b => b.classList.remove('active')); }
function refreshUi() {
  Object.keys(ui).forEach(k => {
    if (!(k in S)) return;
    const c = ui[k];
    if (c.input.type === 'checkbox') c.input.checked = S[k];
    else if (c.input.type !== 'modes') c.input.value = S[k];
    c.refresh(S[k]);
  });
}
function applyAll() { showSub(); setFg(); buildGrid(); }
function applyPreset(name) {
  Object.assign(S, clone(PRESETS[name]));
  refreshUi(); applyAll();
  clearPresetActive();
  if (presetButtons[name]) presetButtons[name].classList.add('active');
}

/* randomise */
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function randomise() {
  const combos = [
    ['#0a0a0b', '#d8ff43'], ['#0d0d0d', '#ff540a'], ['#0d0d0d', '#a098fd'], ['#0e1020', '#8fb8ff'], ['#06201b', '#86f3c3'],
    ['#14102e', '#ff916b'], ['#0d0d0d', '#f9faf7'], ['#004ba0', '#cde3ff'], ['#5426c0', '#cfcafd'], ['#ff540a', '#fff0e4'],
    ['#f9faf7', '#0d0d0d'], ['#fff0e4', '#ff540a'], ['#f9faf7', '#6a5dfd'], ['#d6fb58', '#0d0d0d'], ['#cde3ff', '#004ba0'],
  ];
  const [bg, hi] = pick(combos);
  S.bg = bg; S.high = hi; S.low = mixHex(bg, hi, rnd(.14, .3));
  S.mode = pick(['Pole', 'Dipole', 'Dipole', 'Vortex', 'Plus']);
  S.alignMotion = Math.random() < .7; S.dipAngle = Math.round(rnd(-180, 180));
  S.plusSize = +rnd(0.25, 0.55).toFixed(2); S.plusRot = pick([0, 0, 0, Math.round(rnd(-45, 45))]);
  S.reach = +rnd(0.15, 0.5).toFixed(2); S.falloff = +rnd(1.3, 3.5).toFixed(1);
  S.poles = pick([0, 0, 1, 2, 3]); S.polesDrift = Math.random() < .8; poleSeed = Math.floor(Math.random() * 1e6); seedPoles();
  S.style = pick(['Filing', 'Filing', 'Compass', 'Dash']); S.grid = pick(['Square', 'Square', 'Hex', 'Scatter']);
  S.spacing = S.style === 'Compass' ? pick([20, 24, 28]) : pick([12, 14, 16, 18, 20, 24]);
  S.len = +(S.style === 'Dash' ? rnd(.35, .7) : rnd(.6, 1.1)).toFixed(2);
  S.thick = +(S.style === 'Filing' ? rnd(.8, 1.8) : rnd(1.6, 3.2)).toFixed(1);
  S.lenBy = +rnd(0.2, 0.85).toFixed(2); S.jitter = +rnd(0, 0.35).toFixed(2);
  S.follow = +rnd(0.06, 0.3).toFixed(2); S.ease = +rnd(0.06, 0.25).toFixed(2);
  S.flowAmt = +rnd(0.1, 0.6).toFixed(2); S.flowScale = +rnd(0.8, 3).toFixed(1); S.flowSpeed = +rnd(0.15, 0.7).toFixed(2);
  S.baseAngle = pick([0, 0, 90, -45, 45]); S.minAlpha = +rnd(0.15, 0.5).toFixed(2);
  refreshUi(); applyAll(); clearPresetActive();
}

/* panel show/hide, buttons, keys */
const panel = document.getElementById('panel');
document.getElementById('hideUi').addEventListener('click', () => panel.classList.add('hidden'));
document.getElementById('toggleUi').addEventListener('click', () => panel.classList.remove('hidden'));
document.getElementById('randomBtn').addEventListener('click', randomise);
document.getElementById('exportBtn').addEventListener('click', () => exportPNG(2));
const toast = document.getElementById('toast');
function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1800); }
document.getElementById('copyBtn').addEventListener('click', async () => {
  const json = JSON.stringify(S, null, 2);
  try { await navigator.clipboard.writeText(json); showToast('Settings copied as JSON'); }
  catch (e) { console.log(json); showToast('Clipboard blocked — settings logged to console'); }
});
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { if (e.target.tagName === 'BUTTON') return; e.preventDefault(); pulse(); }
  else if (e.key === 'r') randomise();
  else if (e.key === 'h') panel.classList.toggle('hidden');
});

/* ============================== boot ============================== */
const q = new URLSearchParams(location.search);
resize();
applyPreset(q.get('preset') && PRESETS[q.get('preset')] ? q.get('preset') : 'Filings');
requestAnimationFrame(frame);
</script>
</body>
