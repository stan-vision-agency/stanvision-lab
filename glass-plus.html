  @media (max-width:720px){
    #panel{top:auto; left:12px; right:12px; bottom:12px; width:auto; max-height:46vh;}

<script>if(location.search.indexOf('embed')>-1)document.documentElement.classList.add('embed');</script>
<div id="stage"><canvas id="cv"></canvas></div>

<header>
  <a class="lab-back" href="/"><span class="idx">005</span><span class="lbl">Glass Plus</span></a>
  <p>StanVision Lab — Blender render + WebGL lighting</p>
</header>
<div id="hint">move the cursor · space = flash · r = random · h = hide panel</div>

<aside id="panel">
  <div class="head">
    <span>Controls</span>
    <button class="hidebtn" id="hideUi" title="Hide panel" aria-label="Hide panel">&times;</button>
  </div>
  <div class="body">
    <div class="presets" id="presets"></div>

  </div>
  <div class="footbar">
    <button id="loadBtn" class="secondary">LOAD PNG</button>
    <button id="randomBtn" class="secondary">RANDOMISE</button>

  </div>

<input type="file" id="fileIn" accept="image/png,image/webp" hidden>

<script>
'use strict';
const EMBED = document.documentElement.classList.contains('embed');

/* ============================== state ============================== */
const S = {
  // glass
  refract: 0.05, dispersion: 0.35, softness: 30, facets: 0.35, thickness: 0.06, absorb: 0.3, gain: 1.0, spec: 0.7, lightRad: 0.45, lightSoft: 0.1, rim: 0.0, hotAmt: 0.42, hotRad: 0.19, hotColor: '#d8ff43',
  // motion
  parallax: 28, tilt: 1.0, follow: 0.06, lightFollow: 0.1, idle: true, idleSpeed: 0.25, breathe: 0.012,
  // canvas
  bgColor: '#0a0a0a', accentColor: '#d8ff43',
  plusX: 0.5, plusY: 0.5, plusScale: 1.0,
};
const PRESETS = {
  'Hero':   { ...S },
  'Heavy':  { ...S, refract: 0.11, dispersion: 0.6, softness: 44, facets: 0.9, thickness: 0.12, absorb: 0.7, spec: 1.2, lightRad: 0.7, hotAmt: 1.6, hotRad: 0.36, hotColor: '#ff3d1f', parallax: 40 },
  'Prism':  { ...S, refract: 0.07, dispersion: 1.6, softness: 18, facets: 1.2, thickness: 0.04, absorb: 0.4, spec: 1.0, lightRad: 0.4, lightSoft: 0.3, rim: 0.35, hotAmt: 1.4, hotRad: 0.3 },
  'Calm':   { ...S, refract: 0.03, dispersion: 0.15, softness: 34, facets: 0.3, thickness: 0.03, absorb: 0.45, spec: 0.5, lightRad: 0.8, hotAmt: 0.25, parallax: 14, idleSpeed: 0.15 },
};

/* ============================== gl setup ============================== */
const cv = document.getElementById('cv');
const gl = cv.getContext('webgl', { antialias: false, alpha: false, premultipliedAlpha: false, preserveDrawingBuffer: false });
if (!gl) { document.getElementById('hint').textContent = 'WebGL is not available in this browser'; }

const VS = `attribute vec2 p; varying vec2 v; void main(){ v = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;
const FS = `
precision highp float;
varying vec2 v;
uniform sampler2D uScene, uPlus, uNorm;
uniform vec2 uRes, uPos, uSize, uTilt;
uniform float uRefract, uDisp, uThick, uAbsorb, uGain, uSpec, uRim, uTime, uLightRad, uLightSoft;
uniform vec2 uLight, uHot;
uniform vec3 uAccent, uHotColor;
uniform float uHotAmt, uHotRad;

void main(){
  // everything below works in screen space with y down, matching the canvas textures
  vec2 suv = vec2(v.x, 1.0 - v.y);
  vec2 frag = suv * uRes;
  vec2 puv = (frag - uPos) / uSize;
  float inside = step(0.0, puv.x) * step(puv.x, 1.0) * step(0.0, puv.y) * step(puv.y, 1.0);
  vec4 p = texture2D(uPlus, puv) * inside;
  vec3 n = texture2D(uNorm, puv).xyz * 2.0 - 1.0;
  float a = p.a;

  // refraction: edge normals bend the background, flat faces shift it with the view tilt (slab thickness)
  vec2 off = (n.xy * uRefract + uTilt * uThick) * a;
  off.x *= uRes.y / uRes.x;
  vec3 col;
  col.r = texture2D(uScene, suv + off * (1.0 + uDisp * 0.12)).r;
  col.g = texture2D(uScene, suv + off).g;
  col.b = texture2D(uScene, suv + off * (1.0 - uDisp * 0.12)).b;
  vec3 bg = texture2D(uScene, suv).rgb;
  vec3 refr = mix(bg, col, a) * (1.0 - a * uAbsorb);

  // studio sheen: a large soft light that rides with the cursor and mirrors in the faces (hellohello-style)
  vec3 nn = normalize(n);
  vec2 d = (suv - uLight) * vec2(uRes.x / uRes.y, 1.0);
  float pool = smoothstep(uLightRad, uLightRad * uLightSoft, length(d));
  vec3 Ld = normalize(vec3(-d.x * 1.4, -d.y * 1.4, 0.8));
  vec3 Hh = normalize(Ld + vec3(0.0, 0.0, 1.0));
  float lum = dot(p.rgb, vec3(0.3, 0.59, 0.11));
  float face = pow(max(dot(nn, Hh), 0.0), 10.0) * (0.25 + lum * 1.5);
  float edge = clamp(length(n.xy) * 1.6, 0.0, 1.0) * a;
  float sheen = (face * 0.5 + edge * 1.2 * max(dot(nn, Ld), 0.0)) * pool * a * uSpec;
  // cursor light: a small hot coloured lamp at the pointer; the glass picks up its colour the closer it gets
  vec2 hd = (suv - uHot) * vec2(uRes.x / uRes.y, 1.0);
  float hdist = length(hd);
  float hot = smoothstep(uHotRad, uHotRad * 0.08, hdist);
  float halo = smoothstep(uHotRad * 2.2, 0.0, hdist) * 0.12;
  vec3 HL = normalize(vec3(-hd.x * 2.0, -hd.y * 2.0, 0.5));
  float hface = pow(max(dot(nn, normalize(HL + vec3(0.0, 0.0, 1.0))), 0.0), 6.0) * (0.3 + lum * 1.4);
  float hedge = edge * (0.4 + max(dot(nn, HL), 0.0));
  float hotLight = ((hface * 0.55 + hedge * 1.3) * hot + (hface * 0.4 + hedge) * halo) * a * uHotAmt;
  sheen *= 1.0 - 0.8 * clamp(hot + halo, 0.0, 1.0) * min(uHotAmt, 1.0);   // the lamp takes over from the white studio light where it lands
  // the refracted background warms up too, as if the lamp shines through the glass
  refr += uHotColor * hot * a * uHotAmt * 0.12 * (1.0 - uAbsorb);
  vec3 glass = p.rgb * a * uGain + vec3(0.92, 0.96, 1.0) * sheen + uHotColor * hotLight + uAccent * edge * uRim * pool;

  gl_FragColor = vec4(refr + glass, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aP = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(aP); gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
const U = {};
['uScene','uPlus','uNorm','uRes','uPos','uSize','uTilt','uRefract','uDisp','uThick','uAbsorb','uGain','uSpec','uRim','uTime','uAccent','uLight','uLightRad','uLightSoft','uHot','uHotColor','uHotAmt','uHotRad']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

function makeTex(unit) {
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  return t;
}
const texScene = makeTex(0), texPlus = makeTex(1), texNorm = makeTex(2);
gl.uniform1i(U.uScene, 0); gl.uniform1i(U.uPlus, 1); gl.uniform1i(U.uNorm, 2);
gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);

/* ============================== the glass image ============================== */
let plusImg = null, plusW = 1, plusH = 1;

function fallbackPlus() {
  // procedural stand-in used only if the embedded render fails to decode
  const w = 1150, h = 1208, c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  const arm = 300, len = 1000, cx = w / 2, cy = h / 2 - 60, r = 40;
  const rr = (X, Y, W, H) => { x.beginPath(); x.roundRect(X, Y, W, H, r); };
  x.fillStyle = 'rgba(120,140,160,0.28)';
  rr(cx - len / 2, cy - arm / 2, len, arm); x.fill();
  rr(cx - arm / 2, cy - len / 2, arm, len); x.fill();
  x.lineWidth = 14; x.strokeStyle = 'rgba(230,240,255,0.85)';
  rr(cx - len / 2, cy - arm / 2, len, arm); x.stroke();
  rr(cx - arm / 2, cy - len / 2, arm, len); x.stroke();
  x.strokeStyle = 'rgba(255,255,255,0.35)'; x.lineWidth = 6;
  rr(cx - arm / 2 + 30, cy - arm / 2 + 30, arm - 60, arm - 60); x.stroke();
  return c;
}

function setPlus(img) {
  plusImg = img; plusW = img.naturalWidth || img.width; plusH = img.naturalHeight || img.height;
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texPlus);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  buildNormals();
}

/* ============================== height -> normal map ============================== */
// Height = blurred alpha (a rounded slab: flat in the middle, curving at the edges) + high-passed luminance (the inner facets).
const NW = 384;
let normTimer = 0;
function scheduleNormals() { clearTimeout(normTimer); normTimer = setTimeout(buildNormals, 70); }

function boxBlur(src, dst, w, h, r) {
  const tmp = new Float32Array(w * h);
  const iarr = 1 / (r + r + 1);
  for (let y = 0; y < h; y++) {
    let ti = y * w, li = ti, ri = ti + r, fv = src[ti], lv = src[ti + w - 1], val = (r + 1) * fv;
    for (let j = 0; j < r; j++) val += src[ti + Math.min(j, w - 1)];
    for (let j = 0; j <= r; j++) { val += (ri < ti + w ? src[ri] : lv) - fv; ri++; tmp[ti++] = val * iarr; }
    for (let j = r + 1; j < w - r; j++) { val += src[ri++] - src[li++]; tmp[ti++] = val * iarr; }
    for (let j = w - r; j < w; j++) { val += lv - src[li++]; tmp[ti++] = val * iarr; }
  }
  for (let x = 0; x < w; x++) {
    let ti = x, li = ti, ri = ti + r * w, fv = tmp[ti], lv = tmp[ti + w * (h - 1)], val = (r + 1) * fv;
    for (let j = 0; j < r; j++) val += tmp[ti + Math.min(j, h - 1) * w];
    for (let j = 0; j <= r; j++) { val += (ri < w * h ? tmp[ri] : lv) - fv; ri += w; dst[ti] = val * iarr; ti += w; }
    for (let j = r + 1; j < h - r; j++) { val += tmp[ri] - tmp[li]; ri += w; li += w; dst[ti] = val * iarr; ti += w; }
    for (let j = h - r; j < h; j++) { val += lv - tmp[li]; li += w; dst[ti] = val * iarr; ti += w; }
  }
}
function gauss(src, w, h, r) {
  if (r < 1) return Float32Array.from(src);
  const a = new Float32Array(w * h), b = new Float32Array(w * h);
  boxBlur(src, a, w, h, r); boxBlur(a, b, w, h, r); boxBlur(b, a, w, h, r);
  return a;
}

function buildNormals() {
  if (!plusImg) return;
  const w = NW, h = Math.max(2, Math.round(NW * plusH / plusW));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(plusImg, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data;
  const alpha = new Float32Array(w * h), lum = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const a = d[i * 4 + 3] / 255; alpha[i] = a;
    lum[i] = (0.3 * d[i * 4] + 0.59 * d[i * 4 + 1] + 0.11 * d[i * 4 + 2]) / 255 * a;
  }
  const rEdge = Math.max(1, Math.round(S.softness * w / 1000));
  const slab = gauss(alpha, w, h, rEdge);
  const lumS = gauss(lum, w, h, 2), lumB = gauss(lum, w, h, 9);
  const out = new Uint8Array(w * h * 4);
  const k = 2.2, kf = S.facets * 0.9;
  for (let y = 0; y < h; y++) for (let X = 0; X < w; X++) {
    const i = y * w + X;
    const xl = Math.max(X - 1, 0), xr = Math.min(X + 1, w - 1), yu = Math.max(y - 1, 0), yd = Math.min(y + 1, h - 1);
    const hL = slab[y * w + xl] + (lumS[y * w + xl] - lumB[y * w + xl]) * kf;
    const hR = slab[y * w + xr] + (lumS[y * w + xr] - lumB[y * w + xr]) * kf;
    const hU = slab[yu * w + X] + (lumS[yu * w + X] - lumB[yu * w + X]) * kf;
    const hD = slab[yd * w + X] + (lumS[yd * w + X] - lumB[yd * w + X]) * kf;
    let nx = -(hR - hL) * k * w / 40, ny = -(hD - hU) * k * h / 40, nz = 1;
    const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
    out[i * 4] = (nx * 0.5 + 0.5) * 255; out[i * 4 + 1] = (ny * 0.5 + 0.5) * 255; out[i * 4 + 2] = (nz * 0.5 + 0.5) * 255; out[i * 4 + 3] = 255;
  }
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texNorm);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, out);
}

/* ============================== scene (the hero, drawn to a texture) ============================== */
const scene = document.createElement('canvas');
const sx = scene.getContext('2d');
let W = 0, H = 0, dpr = 1, availW = 0;
let sceneTimer = 0;
function scheduleScene() { clearTimeout(sceneTimer); sceneTimer = setTimeout(drawScene, 40); }

function layout() {
  const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = Math.round(w * dpr); H = Math.round(h * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const panelOpen = !EMBED && innerWidth > 720 && !document.getElementById('panel').classList.contains('hidden');
  availW = panelOpen ? W - 320 * dpr : W;
  gl.viewport(0, 0, W, H);
  drawScene();
}
addEventListener('resize', layout);

function drawScene() {
  if (!W) return;
  scene.width = W; scene.height = H;
  sx.fillStyle = S.bgColor; sx.fillRect(0, 0, W, H);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texScene);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, scene);
}
function hexA(hex, a) {
  const c = hex.replace('#', ''); return `rgba(${parseInt(c.slice(0, 2), 16)},${parseInt(c.slice(2, 4), 16)},${parseInt(c.slice(4, 6), 16)},${a})`;
}
function applyColors() {
  document.documentElement.style.setProperty('--ink', S.bgColor);
  const c = S.bgColor.replace('#', '');
  const r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
  const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  document.documentElement.style.setProperty('--pagefg', lum > 0.6 ? '#14161a' : '#e6ebf2');
  scheduleScene();
}
function hex3(hex) { const c = hex.replace('#', ''); return [0, 2, 4].map(i => parseInt(c.slice(i, i + 2), 16) / 255); }

/* ============================== cursor ============================== */
let tx = 0, ty = 0, cx = 0, cy = 0, lx = 0.5, ly = 0.5, hx = 0.5, hy = 0.5, lastMove = -1e9, hasPointer = false, flash = 0;
addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  tx = ((e.clientX - r.left) / r.width) * 2 - 1;
  ty = ((e.clientY - r.top) / r.height) * 2 - 1;
  lastMove = performance.now(); hasPointer = true;
});
document.addEventListener('mouseleave', () => { hasPointer = false; });

/* ============================== loop ============================== */
const t0 = performance.now();
function loop() {
  requestAnimationFrame(loop);
  if (!W || !plusImg) return;
  const now = performance.now(), t = (now - t0) / 1000;

  const idling = (S.idle || EMBED) && (!hasPointer || now - lastMove > 1800);
  let gx = tx, gy = ty;
  if (idling) { const a = t * S.idleSpeed * 1.6; gx = 0.55 * Math.sin(a); gy = 0.35 * Math.sin(a * 2.0 + 0.7); }
  cx += (gx - cx) * S.follow; cy += (gy - cy) * S.follow;
  lx += ((gx * 0.5 + 0.5) - lx) * S.lightFollow; ly += ((gy * 0.5 + 0.5) - ly) * S.lightFollow;
  hx += ((gx * 0.5 + 0.5) - hx) * 0.22; hy += ((gy * 0.5 + 0.5) - hy) * 0.22;

  const u = Math.min(availW, H) / 1000;
  const breathe = 1 + Math.sin(t * 0.9) * S.breathe;
  const size = 780 * u * S.plusScale * breathe;
  const sw = size, sh = size * plusH / plusW;
  // parallax: the glass drifts against the cursor, as a near object does
  const px = availW * S.plusX - sw / 2 - cx * S.parallax * u * dpr * 0.5;
  const py = H * S.plusY - sh / 2 - cy * S.parallax * u * dpr * 0.5;

  gl.uniform2f(U.uRes, W, H);
  gl.uniform2f(U.uPos, px, py);
  gl.uniform2f(U.uSize, sw, sh);
  gl.uniform2f(U.uTilt, cx * S.tilt, cy * S.tilt);
  gl.uniform1f(U.uRefract, S.refract);
  gl.uniform1f(U.uDisp, S.dispersion);
  gl.uniform1f(U.uThick, S.thickness);
  gl.uniform1f(U.uAbsorb, S.absorb);
  flash *= 0.93;
  gl.uniform1f(U.uGain, S.gain);
  gl.uniform1f(U.uSpec, S.spec * (1 + flash));
  gl.uniform1f(U.uRim, S.rim);
  gl.uniform2f(U.uLight, lx, ly);
  gl.uniform1f(U.uLightRad, S.lightRad);
  gl.uniform1f(U.uLightSoft, S.lightSoft);
  gl.uniform2f(U.uHot, hx, hy);
  gl.uniform1f(U.uHotAmt, S.hotAmt + flash * 2.5);
  gl.uniform1f(U.uHotRad, S.hotRad * (1 + flash * 0.8));
  const hc = hex3(S.hotColor); gl.uniform3f(U.uHotColor, hc[0], hc[1], hc[2]);
  gl.uniform1f(U.uTime, t);
  const ac = hex3(S.accentColor); gl.uniform3f(U.uAccent, ac[0], ac[1], ac[2]);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

const ui = {};

function slider(key, label, min, max, step, fmt, onChange) {
  const wrap = document.createElement('div'); wrap.className = 'slider-row';
  const top = document.createElement('div'); top.className = 'top';
  const lab = document.createElement('label'); lab.textContent = label;
  const val = document.createElement('span'); val.className = 'val';
  top.append(lab, val);
  const input = document.createElement('input');
  input.type = 'range'; input.min = min; input.max = max; input.step = step; input.value = S[key];
  const refresh = v => { val.textContent = fmt ? fmt(v) : (+v).toFixed(step < 1 ? (step < 0.01 ? 3 : (step < 0.1 ? 2 : 1)) : 0); };
  refresh(S[key]);
  input.addEventListener('input', () => { S[key] = +input.value; refresh(S[key]); onChange && onChange(S[key]); clearPresetActive(); });
  wrap.append(top, input);
  ui[key] = { input, refresh };
  return wrap;
}
function colorCtl(key, label, onChange) {
  const row = document.createElement('div'); row.className = 'row';
  const lab = document.createElement('label'); lab.textContent = label;
  const input = document.createElement('input'); input.type = 'color'; input.value = S[key];
  input.addEventListener('input', () => { S[key] = input.value; onChange && onChange(S[key]); clearPresetActive(); });
  row.append(lab, input);
  ui[key] = { input, refresh: () => {} };
  return row;
}
function toggle(key, label, onChange) {
  const row = document.createElement('div'); row.className = 'row';
  const lab = document.createElement('label'); lab.textContent = label;
  const sw = document.createElement('span'); sw.className = 'switch';
  const input = document.createElement('input'); input.type = 'checkbox'; input.checked = S[key];
  const i = document.createElement('i');
  sw.append(input, i);
  input.addEventListener('change', () => { S[key] = input.checked; onChange && onChange(S[key]); clearPresetActive(); });
  row.append(lab, sw);
  ui[key] = { input, refresh: () => {} };
  return row;
}
