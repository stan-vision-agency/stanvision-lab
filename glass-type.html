<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes; uniform float uTime;
uniform sampler2D uTex;
uniform vec2 uOffset, uMouse;
uniform int uCount;
uniform vec4 uStrip[16];   /* x0, x1 (uv), vertical shift (uv), refraction multiplier */
uniform vec2 uStripB[16];  /* height multiplier, tone */
uniform float uRefract, uBulge, uBlur, uDisp, uHeight, uFade, uEdge, uFill, uTone, uBoost;
uniform float uReach, uPush, uSheen;
uniform vec3 uBg, uTextCol, uG0, uG1, uG2;
uniform float uGradAmt, uGradSpread, uGradFlow, uGradY, uGlow, uGrain, uFlash;

float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

vec4 gradient(vec2 p){
  float a = uRes.x / uRes.y;
  float tm = uTime * uGradFlow;
  vec2 q = vec2((p.x - .5) * a, p.y - .5 - uGradY);
  vec2 c0 = vec2(-.22 + .06 * sin(tm * .61), -.02 + .05 * cos(tm * .47));
  vec2 c1 = vec2( .02 + .05 * sin(tm * .53 + 2.1), .04 + .05 * sin(tm * .71 + 1.3));
  vec2 c2 = vec2( .26 + .06 * cos(tm * .43 + 4.2), -.01 + .05 * sin(tm * .37 + 3.4));
  float s = uGradSpread * uGradSpread;
  vec2 d0 = q - c0, d1 = q - c1, d2 = q - c2;
  float w0 = exp(-dot(d0, d0) / s), w1 = exp(-dot(d1, d1) / s), w2 = exp(-dot(d2, d2) / s);
  return vec4(uG0 * w0 + uG1 * w1 + uG2 * w2, w0 + w1 + w2);
}

void main(){
  vec2 frag = gl_FragCoord.xy - uOffset;
  vec2 uv = frag / uRes;

  /* which pane are we in */
  int idx = -1; vec4 st = vec4(0.); vec2 sb = vec2(1.);
  for (int i = 0; i < 16; i++){
    if (i >= uCount) break;
    vec4 s = uStrip[i];
    if (uv.x >= s.x && uv.x < s.y){ idx = i; st = s; sb = uStripB[i]; break; }
  }
  float hw = (st.y - st.x) * .5;
  float cx = (st.x + st.y) * .5;
  float t = idx >= 0 ? (uv.x - cx) / max(hw, 1e-4) : 0.;

  /* vertical extent of the pane, per-pane height */
  float vy = abs(uv.y - .5) / max(uHeight * .5 * sb.x, 1e-4);
  float vmask = idx >= 0 ? 1. - smoothstep(1. - uFade, 1., vy) : 0.;

  /* cursor proximity to this pane (px) */
  vec2 mpx = uMouse - uOffset;
  float dmx = abs(cx * uRes.x - mpx.x);
  float near = exp(-dmx * dmx / (uReach * uReach * uRes.x * uRes.x));
  float dmy = (uv.y * uRes.y - mpx.y) / uRes.y;
  float pool = exp(-(dmx * dmx / (uRes.x * uRes.x) + dmy * dmy) / .06);

  /* refraction: cylindrical pane, per-pane multiplier, stronger near the cursor */
  float k = mix(t, t * abs(t), uBulge);
  float d = uRefract * hw * k * st.w * (1. + uPush * near) * (1. + uFlash * 1.6);
  float shift = st.z * (1. + uFlash * 2.);

  /* text through the glass: refracted, dispersed, smeared vertically */
  vec3 txt = vec3(0.); float wsum = 0.;
  float blur = (uBlur * (1. + uFlash)) / uRes.y / 3.;
  vec2 uR = vec2(uv.x - d * (1. + uDisp), uv.y + shift);
  vec2 uG = vec2(uv.x - d, uv.y + shift);
  vec2 uB = vec2(uv.x - d * (1. - uDisp), uv.y + shift);
  for (int j = -6; j <= 6; j++){
    float fj = float(j); float w = exp(-fj * fj / 12.);
    vec2 o = vec2(0., fj * blur);
    txt.r += w * texture2D(uTex, uR + o).a;
    txt.g += w * texture2D(uTex, uG + o).a;
    txt.b += w * texture2D(uTex, uB + o).a;
    wsum += w;
  }
  txt /= wsum;
  float sharp = texture2D(uTex, uv).a;
  float glow = texture2D(uTex, uv, 5.5).a * .6;

  /* gradient light behind the glass, slightly refracted too */
  vec4 g = gradient(vec2(uv.x - d * .6, uv.y + shift * .5));
  float tone = mix(1., .55 + .9 * sb.y, uTone);
  float bgL = smoothstep(.35, .65, dot(uBg, vec3(.2126, .7152, .0722)));
  float lit = g.w * uGradAmt * tone * vmask;

  /* pane edges: a thin seam */
  float ex = idx >= 0 ? max(min(uv.x - st.x, st.y - uv.x), 0.) * uRes.x : 1e4;
  float seam = exp(-ex / 1.4) * vmask;

  /* composite: dark backgrounds add light, light backgrounds get tinted */
  vec3 gNorm = g.rgb / max(g.w, 1e-3);
  vec3 dark = uBg + g.rgb * (uGradAmt + uFill) * tone * vmask;
  dark += mix(g.rgb * 2. + .05, vec3(1.), .35) * seam * uEdge;
  dark += mix(vec3(1.), g.rgb * 3. + .4, .5) * pool * uSheen * vmask;
  vec3 light = uBg * mix(vec3(1.), gNorm, clamp(lit, 0., 1.));
  light = mix(light, vec3(1.), uFill * .6 * vmask);
  light = mix(light, uBg * .55, seam * uEdge * .8);
  light += pool * uSheen * .4 * vmask;
  vec3 col = mix(dark, light, bgL);

  /* type: layered, then emissive boost + glow on dark backgrounds */
  vec3 alpha = clamp(mix(vec3(sharp), txt, vmask), 0., 1.);
  col = mix(col, uTextCol, alpha);
  col += uTextCol * txt * (uBoost + uFlash * .8) * vmask * (1. - bgL);
  col += uTextCol * glow * uGlow * (1. + uFlash) * (1. - bgL);
  col = mix(col, uTextCol, glow * uGlow * .35 * bgL);

  /* grain */
  col += (hash(frag + fract(uTime) * 100.) - .5) * uGrain;
  gl_FragColor = vec4(col, 1.);
}
</script>

const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const panel = document.getElementById('panel');
const stage = document.getElementById('stage');
let offsetX = 0, flash = 0;
const mouse = { x: innerWidth / 2, y: innerHeight / 2, tx: innerWidth / 2, ty: innerHeight / 2, seen: false };
const t0 = performance.now();

/* ============================== gl ============================== */
const cvs = document.getElementById('gl');
const gl = cvs.getContext('webgl', { antialias: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
const DPR = Math.min(devicePixelRatio || 1, IS_EMBED ? 1 : 2);
function compile(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }'));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = {};
['uRes','uTime','uTex','uOffset','uMouse','uCount','uStrip','uStripB',
 'uRefract','uBulge','uBlur','uDisp','uHeight','uFade','uEdge','uFill','uTone','uBoost',
 'uReach','uPush','uSheen','uBg','uTextCol','uG0','uG1','uG2',
 'uGradAmt','uGradSpread','uGradFlow','uGradY','uGlow','uGrain','uFlash'].forEach(n => U[n] = gl.getUniformLocation(prog, n));

/* text texture: 2048×1024 power-of-two canvas, mipmapped so the shader can sample a blurred copy for the glow */
const TW = 2048, TH = 1024;
const tcv = document.createElement('canvas'); tcv.width = TW; tcv.height = TH;
const tctx = tcv.getContext('2d');
const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
function uploadTex(){ gl.bindTexture(gl.TEXTURE_2D, tex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tcv); gl.generateMipmap(gl.TEXTURE_2D); }
function drawText(){
  const W = innerWidth, H = innerHeight;
  tctx.clearRect(0, 0, TW, TH);
  tctx.save();
  tctx.scale(TW / W, TH / H);
  const lines = [S.line1, S.line2].map(l => (S.caps ? l.toUpperCase() : l)).filter(l => l.trim().length);
  if (!lines.length) { tctx.restore(); uploadTex(); return; }
  let fs = H * S.size;
  const font = px => `${S.weight} ${px}px Archivo, system-ui, sans-serif`;
  tctx.font = font(fs);
  if ('letterSpacing' in tctx) tctx.letterSpacing = (S.tracking * fs) + 'px';
  const widest = Math.max(...lines.map(l => tctx.measureText(l).width));
  if (widest > W * 0.9) { fs *= W * 0.9 / widest; tctx.font = font(fs); if ('letterSpacing' in tctx) tctx.letterSpacing = (S.tracking * fs) + 'px'; }
  const lh = fs * S.lineGap;
  const total = lh * (lines.length - 1);
  tctx.fillStyle = '#fff'; tctx.textAlign = 'center'; tctx.textBaseline = 'middle';
  lines.forEach((l, i) => tctx.fillText(l, W / 2 + (S.tracking * fs) / 2, H / 2 - total / 2 + i * lh + fs * 0.04));
  tctx.restore();
  uploadTex();
}
if (document.fonts && document.fonts.load) {
  Promise.all(['500', '600', '800'].map(w => document.fonts.load(`${w} 40px Archivo`))).then(drawText).catch(() => {});
}

/* ============================== glass panes ============================== */
/* panes are defined by their shared boundaries, so the glass is always continuous: whatever a boundary
   does (parallax, push, re-cut), the pane on its left ends exactly where the pane on its right starts.
   pane: relative width (eased toward a re-cut target), refraction multiplier, height multiplier, tone, drift sign, vertical shift
   edge: parallax depth, lag, current drift */
const MAXP = 16;
let panes = [], edges = [];
let seed = 7;
const srand = () => { seed = (seed * 16807 + 11) % 2147483647; return (seed & 0x7fffffff) / 2147483647; };
function cutPanes(){
  const nextP = [], nextE = [];
  for (let i = 0; i < MAXP; i++){
    const r = srand();
    const p = panes[i] || { w: 1, sy: 0 };
    nextP.push({
      w: p.w, tw: 0.45 + Math.pow(r, 1.6) * 1.6,
      k: srand() < 0.2 ? -(0.3 + srand() * 0.5) : 0.45 + srand() * 1.1,
      h: 0.78 + srand() * 0.5,
      tone: srand(),
      dir: srand() < 0.5 ? -1 : 1,
      lag: 0.5 + srand() * 1.2,
      sy: p.sy,
    });
  }
  for (let i = 0; i <= MAXP; i++){
    const e = edges[i] || { ox: 0 };
    nextE.push({ depth: 0.65 + srand() * 0.7, lag: 0.5 + srand() * 1.2, ox: e.ox });
  }
  panes = nextP; edges = nextE;
}
cutPanes();
function recut(){ seed = Math.floor(Math.random() * 2147483646) + 1; cutPanes(); flash = 1; }
const stripData = new Float32Array(MAXP * 4), stripB = new Float32Array(MAXP * 2);
const pos = new Float64Array(MAXP + 1);
function updatePanes(dt){
  const n = Math.min(MAXP, Math.max(1, Math.round(S.count)));
  const mx = (mouse.x - innerWidth / 2 - offsetX) / innerWidth, my = (mouse.y - innerHeight / 2) / innerHeight;
  let sum = 0;
  for (let i = 0; i < n; i++){ const p = panes[i]; p.w += (p.tw - p.w) * 0.08; sum += p.w; }
  /* base boundary positions, then each boundary drifts on its own */
  let x = 0.5 - S.band / 2;
  for (let i = 0; i <= n; i++){
    const e = edges[i];
    const dx = x - 0.5 - mx;
    const push = Math.sign(dx || 1) * S.push * 0.04 * Math.exp(-(dx * dx) / (S.reach * S.reach));
    const target = mx * S.parallax * e.depth + push;
    e.ox += (target - e.ox) * Math.min(1, S.follow * e.lag);
    pos[i] = x + e.ox;
    if (i < n) x += panes[i].w / sum * S.band;
  }
  /* boundaries may never cross: keep every pane at least 0.8% of the width wide */
  const minW = 0.008;
  for (let i = 1; i <= n; i++) if (pos[i] < pos[i - 1] + minW) pos[i] = pos[i - 1] + minW;
  for (let i = 0; i < n; i++){
    const p = panes[i];
    const cx = (pos[i] + pos[i + 1]) / 2;
    const ty = (p.tone - 0.5) * S.jitter * 2 - my * S.tilt * p.dir * edges[i].depth;
    p.sy += (ty - p.sy) * Math.min(1, S.follow * p.lag);
    stripData[i * 4] = pos[i]; stripData[i * 4 + 1] = pos[i + 1];
    stripData[i * 4 + 2] = p.sy * (reducedMotion ? 0 : 1); stripData[i * 4 + 3] = 1 + (p.k - 1) * S.vary;
    stripB[i * 2] = p.h; stripB[i * 2 + 1] = p.tone;
  }
  return n;
}

function layout(){ offsetX = (!IS_EMBED && innerWidth > 720 && !panel.classList.contains('hidden')) ? -160 : 0; }
function setFg(){
  const c = hex(S.bg); const lum = .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
  document.documentElement.style.setProperty('--pagefg', lum > 0.55 ? '#14161a' : '#e6ebf2');
  document.body.style.background = S.bg;
}
function resize(){
  const w = Math.floor(innerWidth * DPR), h = Math.floor(innerHeight * DPR);
  if (cvs.width !== w || cvs.height !== h){ cvs.width = w; cvs.height = h; drawText(); }
}
addEventListener('resize', () => { resize(); layout(); });

function setUniforms(w, h, dpr, time, n){
  gl.uniform2f(U.uRes, w, h); gl.uniform1f(U.uTime, time);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(U.uTex, 0);
  gl.uniform2f(U.uOffset, offsetX * dpr * (w / (innerWidth * dpr)), 0);
  gl.uniform2f(U.uMouse, mouse.x * dpr, h - mouse.y * dpr);
  gl.uniform1i(U.uCount, n);
  gl.uniform4fv(U.uStrip, stripData); gl.uniform2fv(U.uStripB, stripB);
  gl.uniform1f(U.uRefract, S.refract); gl.uniform1f(U.uBulge, S.bulge); gl.uniform1f(U.uBlur, S.blur * dpr);
  gl.uniform1f(U.uDisp, S.disp); gl.uniform1f(U.uHeight, S.height); gl.uniform1f(U.uFade, S.fade);
  gl.uniform1f(U.uEdge, S.edge); gl.uniform1f(U.uFill, S.fill); gl.uniform1f(U.uTone, S.tone); gl.uniform1f(U.uBoost, S.boost);
  gl.uniform1f(U.uReach, S.reach); gl.uniform1f(U.uPush, S.push); gl.uniform1f(U.uSheen, S.sheen);
  gl.uniform3fv(U.uBg, hex(S.bg)); gl.uniform3fv(U.uTextCol, hex(S.textColor));
  gl.uniform3fv(U.uG0, hex(S.g0)); gl.uniform3fv(U.uG1, hex(S.g1)); gl.uniform3fv(U.uG2, hex(S.g2));
  gl.uniform1f(U.uGradAmt, S.gradAmt); gl.uniform1f(U.uGradSpread, S.gradSpread);
  gl.uniform1f(U.uGradFlow, reducedMotion ? 0 : S.gradFlow); gl.uniform1f(U.uGradY, S.gradY);
  gl.uniform1f(U.uGlow, S.glow); gl.uniform1f(U.uGrain, S.grain); gl.uniform1f(U.uFlash, flash);
}
let last = 0;
function frame(now){
  requestAnimationFrame(frame);
  resize();
  const time = (now - t0) / 1000;
  const dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now;
  /* idle cursor when nobody is moving it (always in embed) */
  if ((S.idle && !mouse.seen) || IS_EMBED){
    const a = time * .3;
    mouse.tx = innerWidth * (.5 + .34 * Math.sin(a)) + offsetX;
    mouse.ty = innerHeight * (.5 + .22 * Math.sin(2 * a + 1.2));
  }
  mouse.x += (mouse.tx - mouse.x) * 0.1;
  mouse.y += (mouse.ty - mouse.y) * 0.1;
  flash *= .92; if (flash < .001) flash = 0;
  const n = updatePanes(dt);
  gl.viewport(0, 0, cvs.width, cvs.height);
  setUniforms(cvs.width, cvs.height, DPR, time, n);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
let idleTimer;
addEventListener('pointermove', e => {
  mouse.tx = e.clientX; mouse.ty = e.clientY; mouse.seen = true;
  clearTimeout(idleTimer); idleTimer = setTimeout(() => mouse.seen = false, 4000);
});

/* ============================== export ============================== */
function exportPNG(scale, fixed){
  const w = fixed ? fixed[0] : Math.floor(innerWidth * scale), h = fixed ? fixed[1] : Math.floor(innerHeight * scale);
  const dpr = fixed ? fixed[1] / innerHeight : scale;
  const ow = cvs.width, oh = cvs.height;
  cvs.width = w; cvs.height = h;
  gl.viewport(0, 0, w, h);
  const n = Math.min(MAXP, Math.max(1, Math.round(S.count)));
  setUniforms(w, h, dpr, (performance.now() - t0) / 1000, n);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  const url = cvs.toDataURL('image/png');
  cvs.width = ow; cvs.height = oh;
  const a = document.createElement('a'); a.href = url; a.download = `glass-type-${w}x${h}.png`; a.click();
  showToast(`Exported ${w} × ${h}`);
}

/* ============================== control panel ============================== */
const ui = {};
const groupsEl = document.getElementById('groups');
function slider(key, label, min, max, step, fmt, onChange) {
  const wrap = document.createElement('div');
  wrap.className = 'slider-row';
  const top = document.createElement('div'); top.className = 'top';
  const lab = document.createElement('label'); lab.textContent = label;
  const val = document.createElement('span'); val.className = 'val';
  top.append(lab, val);
  const input = document.createElement('input');
  input.type = 'range'; input.min = min; input.max = max; input.step = step; input.value = S[key];
  const refresh = v => { val.textContent = fmt ? fmt(v) : (+v).toFixed(step < 1 ? (step < 0.1 ? (step < 0.01 ? 3 : 2) : 1) : 0); };
  refresh(S[key]);
  input.addEventListener('input', () => {
    S[key] = +input.value; refresh(S[key]); onChange && onChange(S[key]); clearPresetActive();
  });
  wrap.append(top, input);
  ui[key] = { input, refresh };
  return wrap;
}
function colorCtl(key, label, onChange) {
  const row = document.createElement('div'); row.className = 'row';
  const lab = document.createElement('label'); lab.textContent = label;
  const input = document.createElement('input'); input.type = 'color'; input.value = S[key];
  input.addEventListener('input', () => { S[key] = input.value; onChange && onChange(S[key]); clearPresetActive(); });
  row.append(lab, input);
  ui[key] = { input, refresh: () => {} };
  return row;
}
function toggle(key, label, onChange) {
  const row = document.createElement('div'); row.className = 'row';
  const lab = document.createElement('label'); lab.textContent = label;
  const sw = document.createElement('span'); sw.className = 'switch';
  const input = document.createElement('input'); input.type = 'checkbox'; input.checked = S[key];
  const i = document.createElement('i');
  sw.append(input, i);
  input.addEventListener('change', () => { S[key] = input.checked; onChange && onChange(S[key]); clearPresetActive(); });
  row.append(lab, sw);
  ui[key] = { input, refresh: () => {} };
  return row;
}
function modes(key, options, onChange, cls) {
  const wrap = document.createElement('div'); wrap.className = 'modes' + (cls ? ' ' + cls : '');
  const btns = {};
  options.forEach(o => {
    const b = document.createElement('button'); b.textContent = o;
    b.addEventListener('click', () => { S[key] = o; refresh(); onChange && onChange(o); clearPresetActive(); });
    wrap.appendChild(b); btns[o] = b;
  });
  const refresh = () => Object.keys(btns).forEach(o => btns[o].classList.toggle('active', S[key] === o));
  refresh();
  ui[key] = { input: { type: 'modes' }, refresh };
  return wrap;
}
function textCtl(key, onChange) {
  const input = document.createElement('input'); input.type = 'text'; input.value = S[key]; input.maxLength = 24; input.spellcheck = false;
  input.addEventListener('input', () => { S[key] = input.value; onChange && onChange(S[key]); clearPresetActive(); });
  ui[key] = { input, refresh: () => {} };
  return input;
}
function sect(title) { const d = document.createElement('div'); d.className = 'sect'; d.textContent = title; return d; }
function note(txt) { const p = document.createElement('p'); p.className = 'note'; p.textContent = txt; return p; }
function buttons(list) {
  const row = document.createElement('div'); row.className = 'btnrow';
  list.forEach(([label, fn]) => { const b = document.createElement('button'); b.textContent = label; b.addEventListener('click', fn); row.appendChild(b); });
  return row;
}
function group(title, items, open = true) {
  const det = document.createElement('details'); det.open = open;
  const sum = document.createElement('summary'); sum.textContent = title;
  const grp = document.createElement('div'); grp.className = 'grp';
  items.forEach(i => grp.appendChild(i));
  det.append(sum, grp);
  groupsEl.appendChild(det);
}

/* presets */
const presetsEl = document.getElementById('presets');
const presetButtons = {};
Object.keys(PRESETS).forEach(name => {
  const b = document.createElement('button');
  b.textContent = name;
  b.addEventListener('click', () => applyPreset(name));
  presetsEl.appendChild(b);
  presetButtons[name] = b;
});
function clearPresetActive() { Object.values(presetButtons).forEach(b => b.classList.remove('active')); }
function refreshUi() {
  Object.keys(ui).forEach(k => {
    if (!(k in S)) return;
    const c = ui[k];
    if (c.input.type === 'checkbox') c.input.checked = S[k];
    else if (c.input.type !== 'modes') c.input.value = S[k];
    c.refresh(S[k]);
  });
}
function applyAll() { drawText(); setFg(); }
function applyPreset(name) {
  Object.assign(S, PRESETS[name]);
  refreshUi(); applyAll();
  clearPresetActive();
  if (presetButtons[name]) presetButtons[name].classList.add('active');
}

/* randomise */
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function hsl(h, s, l) {
  h = ((h % 360) + 360) % 360; const a = s * Math.min(l, 1 - l);
  const f = n => { const k = (n + h / 30) % 12; const c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); return Math.round(c * 255).toString(16).padStart(2, '0'); };
  return '#' + f(0) + f(8) + f(4);
}
function randomise() {
  const light = Math.random() < 0.22;
  const h0 = rnd(0, 360), h1 = h0 + pick([150, 180, 210, 40]);
  if (light) {
    S.bg = hsl(rnd(30, 60), rnd(.15, .35), rnd(.9, .96));
    S.textColor = hsl(rnd(200, 260), rnd(.1, .3), rnd(.06, .14));
    S.g0 = hsl(h0, rnd(.5, .8), rnd(.78, .88)); S.g1 = hsl(h1, rnd(.5, .8), rnd(.78, .88)); S.g2 = hsl(h0 + rnd(-30, 30), rnd(.5, .8), rnd(.8, .9));
    S.gradAmt = rnd(.4, .8); S.glow = 0; S.fill = rnd(.3, .7); S.boost = 0;
  } else {
    S.bg = hsl(rnd(0, 360), rnd(0, .5), rnd(0, .05));
    S.textColor = Math.random() < .7 ? '#ffffff' : hsl(rnd(0, 360), rnd(.2, .8), rnd(.85, .96));
    S.g0 = hsl(h0, rnd(.65, 1), rnd(.45, .6)); S.g1 = hsl(h1, rnd(.65, 1), rnd(.5, .65)); S.g2 = hsl(h0 + rnd(-40, 40), rnd(.6, .9), rnd(.45, .6));
    S.gradAmt = rnd(.4, .9); S.glow = rnd(.1, .5); S.fill = rnd(.05, .3); S.boost = rnd(.1, .6);
  }
  S.weight = pick(['500', '600', '800', '800']);
  S.size = rnd(.16, .28); S.tracking = rnd(-.05, .02); S.lineGap = rnd(.9, 1.1); S.caps = Math.random() < .3;
  S.count = Math.round(rnd(4, 15)); S.band = rnd(.5, .8); S.height = rnd(.6, 1.1); S.fade = rnd(.3, .85);
  S.refract = rnd(.2, .8); S.bulge = rnd(0, .8); S.vary = rnd(.2, 1); S.jitter = rnd(0, .025);
  S.blur = rnd(2, 12); S.disp = rnd(.02, .22); S.edge = rnd(.2, 1.1); S.tone = rnd(.1, .9);
  S.gradSpread = rnd(.16, .34); S.gradFlow = rnd(.2, 1.2); S.gradY = rnd(-.08, .08);
  S.parallax = rnd(.02, .12); S.follow = rnd(.04, .14); S.push = rnd(.3, 2.2); S.reach = rnd(.1, .3); S.tilt = rnd(0, .07); S.sheen = rnd(0, .3);
  S.grain = rnd(0, .06);
  recut();
  refreshUi(); applyAll(); clearPresetActive();
}

document.getElementById('randomBtn').addEventListener('click', randomise);
const toast = document.getElementById('toast');
function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1800); }
document.getElementById('copyBtn').addEventListener('click', async () => {
  const json = JSON.stringify(S, null, 2);
  try { await navigator.clipboard.writeText(json); showToast('Settings copied as JSON'); }
  catch (e) { console.log(json); showToast('Clipboard blocked — settings logged to console'); }
});
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { if (e.target.tagName === 'BUTTON') return; e.preventDefault(); recut(); }
  else if (e.key === 'r') randomise();
  else if (e.key === 'h') { panel.classList.toggle('hidden'); layout(); }
});

/* ============================== boot ============================== */
const q = new URLSearchParams(location.search);
const startPreset = q.get('preset') && PRESETS[q.get('preset')] ? q.get('preset') : 'Primer';
applyPreset(startPreset);
resize(); layout();
requestAnimationFrame(frame);
</script>
</body>
</html>
