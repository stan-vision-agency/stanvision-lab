<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>003 · Air Type — StanVision Lab</title>
<meta name="description" content="A wordmark rasterised into a grid of squares that disperse like air around the cursor. 2D canvas, no WebGL. A StanVision Lab experiment.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ink:#112228;
    --panel:rgba(13,17,23,.86);
    --line:rgba(148,163,184,.16);
    --text:#e6ebf2;
    --mute:#8a94a3;
    --accent:#d8ff43;
  }
  html,body{height:100%;}
  body{
    margin:0; background:var(--ink); color:var(--text);
    font-family:"Archivo",system-ui,-apple-system,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
    transition:background .35s;
  }
  #stage{position:fixed; inset:0;}
  #stage canvas{display:block; width:100%; height:100%; cursor:crosshair;}

  header{position:fixed; top:20px; left:24px; z-index:5; pointer-events:none; color:var(--pagefg,#e6ebf2);}
  header a.lab-back{
    pointer-events:auto; color:inherit; text-decoration:none;
    display:flex; align-items:center; gap:10px;
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; letter-spacing:.04em;
  }
  header a.lab-back .idx{color:#d8ff43;}
  header a.lab-back:hover .lbl{text-decoration:underline; text-underline-offset:3px;}
  header p{margin:4px 0 0; font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.04em; opacity:.55;}

  #hint{
    position:fixed; left:24px; bottom:22px; z-index:5; pointer-events:none;
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--pagefg,#e6ebf2); opacity:.45;
  }

  #panel{
    position:fixed; top:16px; right:16px; bottom:16px; width:288px; z-index:6;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    display:flex; flex-direction:column; overflow:hidden;
    transition:transform .28s cubic-bezier(.4,0,.2,1), opacity .28s;
  }
  #panel.hidden{transform:translateX(calc(100% + 24px)); opacity:0; pointer-events:none;}
  #panel .head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px 12px; border-bottom:1px solid var(--line);}
  #panel .head span{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute);}
  #panel .body{overflow-y:auto; padding:6px 16px 16px; flex:1; scrollbar-width:thin; scrollbar-color:rgba(148,163,184,.3) transparent;}
  #panel .body::-webkit-scrollbar{width:6px;}
  #panel .body::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25); border-radius:3px;}

  .presets{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:14px 0 4px;}
  .presets button{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.03em;
    color:var(--text); background:rgba(148,163,184,.08); border:1px solid var(--line);
    border-radius:8px; padding:8px 6px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .presets button:hover{border-color:rgba(148,163,184,.45);}
  .presets button.active{border-color:var(--accent); background:rgba(216,255,67,.14);}

  details{border-bottom:1px solid var(--line); padding:2px 0;}
  details:last-of-type{border-bottom:none;}
  summary{
    list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between;
    padding:12px 2px; font-size:12px; font-weight:600; letter-spacing:.02em; user-select:none;
  }
  summary::-webkit-details-marker{display:none;}
  summary::after{content:""; width:7px; height:7px; border-right:1.4px solid var(--mute); border-bottom:1.4px solid var(--mute); transform:rotate(45deg); transition:transform .18s; margin-right:3px;}
  details[open] summary::after{transform:rotate(-135deg); margin-top:4px;}
  .grp{padding:0 2px 14px; display:flex; flex-direction:column; gap:11px;}

  .row{display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:22px;}
  .row label{font-size:12px; color:var(--mute); flex:0 0 auto;}
  .slider-row{display:flex; flex-direction:column; gap:6px;}
  .slider-row .top{display:flex; justify-content:space-between; align-items:baseline;}
  .slider-row .top label{font-size:12px; color:var(--mute);}
  .slider-row .top .val{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px; color:var(--text); font-variant-numeric:tabular-nums;}

  input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:18px; background:transparent; cursor:pointer; margin:0;}
  input[type=range]::-webkit-slider-runnable-track{height:2px; background:rgba(148,163,184,.28); border-radius:1px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:var(--text); margin-top:-5px; border:none; transition:transform .12s; box-shadow:0 0 0 3px rgba(5,7,11,.6);}
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15);}
  input[type=range]::-moz-range-track{height:2px; background:rgba(148,163,184,.28); border-radius:1px;}
  input[type=range]::-moz-range-thumb{width:12px; height:12px; border-radius:50%; background:var(--text); border:none;}

  input[type=color]{-webkit-appearance:none; appearance:none; width:44px; height:22px; border:1px solid var(--line); border-radius:6px; background:none; padding:0; cursor:pointer;}
  input[type=color]::-webkit-color-swatch-wrapper{padding:2px;}
  input[type=color]::-webkit-color-swatch{border:none; border-radius:4px;}
  input[type=color]::-moz-color-swatch{border:none; border-radius:4px;}

  input[type=text]{
    width:100%; box-sizing:border-box; font-family:"Archivo",system-ui,sans-serif; font-size:13px; font-weight:600;
    color:var(--text); background:rgba(148,163,184,.08); border:1px solid var(--line); border-radius:8px; padding:9px 10px; outline:none;
  }
  input[type=text]:focus{border-color:rgba(148,163,184,.45);}

  .seg{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;}
  .seg button{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px; letter-spacing:.03em; color:var(--mute);
    background:rgba(148,163,184,.08); border:1px solid var(--line); border-radius:7px; padding:7px 4px; cursor:pointer;
  }
  .seg button.active{color:var(--text); border-color:rgba(148,163,184,.5);}

  .switch{position:relative; width:32px; height:18px; flex:0 0 auto;}
  .switch input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer;}
  .switch i{position:absolute; inset:0; border-radius:9px; background:rgba(148,163,184,.25); transition:background .18s; pointer-events:none;}
  .switch i::after{content:""; position:absolute; left:2px; top:2px; width:14px; height:14px; border-radius:50%; background:var(--text); transition:transform .18s, background .18s;}
  .switch input:checked + i{background:var(--accent);}
  .switch input:checked + i::after{transform:translateX(14px); background:#0f1409;}

  .footbar{border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:8px;}
  .footbar button{
    flex:1; font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.04em;
    color:#0a0605; background:var(--text); border:none; border-radius:8px; padding:9px 0; cursor:pointer; transition:opacity .15s;
  }
  .footbar button:hover{opacity:.85;}

  #toggleUi{
    position:fixed; top:24px; right:16px; z-index:7; width:34px; height:34px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel); backdrop-filter:blur(14px); color:var(--mute); cursor:pointer; font-size:15px; line-height:1;
    display:none; align-items:center; justify-content:center;
  }
  #panel.hidden ~ #toggleUi{display:flex;}

  #toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,12px); z-index:9; background:var(--text); color:#0a0605;
    font-size:12px; font-weight:500; padding:8px 14px; border-radius:8px; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none;
  }
  #toast.show{opacity:1; transform:translate(-50%,0);}
  .hidebtn{background:none; border:none; color:var(--mute); font-size:15px; cursor:pointer; padding:2px 4px; line-height:1;}
  .hidebtn:hover{color:var(--text);}

  @media (max-width:720px){
    #panel{top:auto; left:12px; right:12px; bottom:12px; width:auto; max-height:46vh;}
    #panel.hidden{transform:translateY(calc(100% + 20px));}
    header{left:16px; top:16px;}
    #toggleUi{top:auto; bottom:20px;}
    #hint{display:none;}
  }
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
  html.embed header, html.embed #panel, html.embed #toggleUi, html.embed #toast, html.embed #hint{display:none !important;}
</style>
</head>
<body>
<script>if(location.search.indexOf('embed')>-1)document.documentElement.classList.add('embed');</script>
<div id="stage"><canvas id="cv"></canvas></div>

<header>
  <a class="lab-back" href="/"><span class="idx">003</span><span class="lbl">Air Type</span></a>
  <p>StanVision Lab — Canvas 2D</p>
</header>
<div id="hint">Move the cursor through the word</div>

<aside id="panel">
  <div class="head">
    <span>Controls</span>
    <button class="hidebtn" id="hideUi" title="Hide panel" aria-label="Hide panel">&times;</button>
  </div>
  <div class="body">
    <div class="presets" id="presets"></div>
    <div id="groups"></div>
  </div>
  <div class="footbar">
    <button id="copyBtn">COPY SETTINGS</button>
  </div>
</aside>
<button id="toggleUi" title="Show controls" aria-label="Show controls">☰</button>
<div id="toast">Copied to clipboard</div>

<script>
'use strict';
const EMBED = document.documentElement.classList.contains('embed');

/* ============================== state ============================== */
const S = {
  text: 'stanvision', weight: 800, tracking: -0.04, caps: false,
  cols: 224, fill: 0.84, shape: 'square', threshold: 110,
  reach: 0.30, push: 0.045, lift: 0.016, drift: 0.018, ease: 0.07, follow: 0.10, shrink: 0.5,
  bgColor: '#112228', inkColor: '#ffffff', width: 0.82,
  autoSweep: false, sweepSpeed: 0.35,
};
const PRESETS = {
  'Oxigen': { ...S },
  'Lab': { ...S, bgColor: '#080809', inkColor: '#d8ff43', weight: 900, cols: 180, fill: 0.78, push: 0.06, drift: 0.03 },
  'Paper': { ...S, bgColor: '#f3f1ec', inkColor: '#14161a', weight: 700, cols: 260, fill: 0.9, lift: 0.03, shrink: 0.7 },
  'Dots': { ...S, bgColor: '#05080f', inkColor: '#7cf2ff', shape: 'dot', cols: 150, fill: 0.7, reach: 0.4, push: 0.03, drift: 0.04, ease: 0.05 },
};

/* ============================== rasterise text -> grid ============================== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let cells = [], GW = 0, GH = 0, W = 0, H = 0, cell = 1, originX = 0, originY = 0;
let buildTimer = 0;

function buildGrid() {
  const txt = S.caps ? S.text.toUpperCase() : S.text;
  if (!txt.trim()) { cells = []; return; }
  GW = S.cols;
  // measure at a large size, then scale into the grid width
  const m = document.createElement('canvas').getContext('2d');
  const FS = 400;
  m.font = `${S.weight} ${FS}px "Archivo", system-ui, sans-serif`;
  m.letterSpacing = (S.tracking * FS) + 'px';
  const met = m.measureText(txt);
  const tw = Math.max(1, met.actualBoundingBoxRight + met.actualBoundingBoxLeft);
  const asc = met.actualBoundingBoxAscent, desc = met.actualBoundingBoxDescent;
  const th = Math.max(1, asc + desc);
  const scale = GW / tw;
  GH = Math.max(4, Math.round(th * scale));

  const off = document.createElement('canvas'); off.width = GW; off.height = GH;
  const o = off.getContext('2d');
  o.fillStyle = '#000';
  o.font = `${S.weight} ${FS * scale}px "Archivo", system-ui, sans-serif`;
  o.letterSpacing = (S.tracking * FS * scale) + 'px';
  o.textBaseline = 'alphabetic';
  o.fillText(txt, met.actualBoundingBoxLeft * scale, asc * scale);
  const d = o.getImageData(0, 0, GW, GH).data;
  const old = new Map(cells.map(c => [c.x + ',' + c.y, c]));
  cells = [];
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    if (d[(y * GW + x) * 4 + 3] > S.threshold) {
      const prev = old.get(x + ',' + y);
      cells.push(prev || { x, y, dx: 0, dy: 0, seed: Math.random() });
    }
  }
  layout();
}
function scheduleBuild() { clearTimeout(buildTimer); buildTimer = setTimeout(buildGrid, 60); }

function layout() {
  const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h || !GW) return;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = Math.round(w * dpr); H = Math.round(h * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  // keep the word centred in the space left of the panel when it is open
  const panelOpen = !EMBED && innerWidth > 720 && !document.getElementById('panel').classList.contains('hidden');
  const avail = panelOpen ? W - 320 * dpr : W;
  const maxW = avail * S.width, maxH = H * 0.55;
  cell = Math.min(maxW / GW, maxH / GH);
  originX = (avail - GW * cell) / 2; originY = (H - GH * cell) / 2;
}
addEventListener('resize', layout);

/* ============================== cursor ============================== */
let tmx = -9999, tmy = -9999, mx = -9999, my = -9999, lastMove = -1e9;
addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  tmx = (e.clientX - r.left) * (W / r.width);
  tmy = (e.clientY - r.top) * (H / r.height);
  lastMove = performance.now();
});
addEventListener('pointerleave', () => { tmx = -9999; tmy = -9999; });
document.addEventListener('mouseleave', () => { tmx = -9999; tmy = -9999; });

/* ============================== loop ============================== */
const t0 = performance.now();
function loop() {
  requestAnimationFrame(loop);
  if (!W || !cells.length) return;
  const now = performance.now(), t = (now - t0) / 1000;
  const LW = GW * cell;

  // virtual cursor: figure-eight sweep through the word when enabled (or in embed previews without a pointer)
  const sweeping = (S.autoSweep || EMBED) && (now - lastMove > 1800);
  let cx = tmx, cy = tmy;
  if (sweeping) {
    const a = t * S.sweepSpeed * 2;
    cx = originX + LW * (0.5 + 0.46 * Math.sin(a));
    cy = originY + GH * cell * (0.5 + 0.35 * Math.sin(a * 2));
  }
  if (mx < -9000 || cx < -9000) { mx = cx; my = cy; } else { mx += (cx - mx) * S.follow; my += (cy - my) * S.follow; }

  const R = LW * S.reach;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = S.inkColor;
  const base = cell * S.fill;
  const round = S.shape === 'dot', diamond = S.shape === 'diamond';
  const TAU = 6.283185;
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    const bx = originX + c.x * cell + cell * 0.5, by = originY + c.y * cell + cell * 0.5;
    const vx = bx - mx, vy = by - my, d = Math.hypot(vx, vy) || 0.0001;
    const env = Math.max(0, 1 - d / R), ev = env * env;
    const p = c.seed * TAU;
    const fl = ev * LW * S.drift;
    const driftX = fl * Math.sin(t * 0.9 + (c.x / GW) * 28 + p) + fl * 0.5 * Math.sin(t * 1.9 + p * 1.7);
    const driftY = fl * Math.cos(t * 0.8 + (c.y / GH) * 6.4 + p) + fl * 0.5 * Math.cos(t * 1.7 + p * 1.3);
    const push = ev * LW * S.push;
    const tx = (vx / d) * push + driftX;
    const ty = (vy / d) * push + driftY - ev * LW * S.lift;
    c.dx += (tx - c.dx) * S.ease; c.dy += (ty - c.dy) * S.ease;
    const s = base * (1 - ev * S.shrink);
    const x = bx + c.dx, y = by + c.dy;
    if (round) { ctx.beginPath(); ctx.arc(x, y, s * 0.5, 0, TAU); ctx.fill(); }
    else if (diamond) { ctx.beginPath(); ctx.moveTo(x, y - s * 0.6); ctx.lineTo(x + s * 0.6, y); ctx.lineTo(x, y + s * 0.6); ctx.lineTo(x - s * 0.6, y); ctx.fill(); }
    else ctx.fillRect(x - s * 0.5, y - s * 0.5, s, s);
  }
}

/* ============================== page colours ============================== */
function applyColors() {
  document.body.style.background = S.bgColor;
  document.documentElement.style.setProperty('--ink', S.bgColor);
  const c = S.bgColor.replace('#', '');
  const r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
  const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  document.documentElement.style.setProperty('--pagefg', lum > 0.6 ? '#14161a' : '#e6ebf2');
}

/* ============================== control panel ============================== */
const ui = {};
const groupsEl = document.getElementById('groups');
let activePreset = 'Oxigen';

function slider(key, label, min, max, step, fmt, onChange) {
  const wrap = document.createElement('div'); wrap.className = 'slider-row';
  const top = document.createElement('div'); top.className = 'top';
  const lab = document.createElement('label'); lab.textContent = label;
  const val = document.createElement('span'); val.className = 'val';
  top.append(lab, val);
  const input = document.createElement('input');
  input.type = 'range'; input.min = min; input.max = max; input.step = step; input.value = S[key];
  const refresh = v => { val.textContent = fmt ? fmt(v) : (+v).toFixed(step < 1 ? (step < 0.01 ? 3 : (step < 0.1 ? 2 : 1)) : 0); };
  refresh(S[key]);
  input.addEventListener('input', () => { S[key] = +input.value; refresh(S[key]); onChange && onChange(S[key]); clearPresetActive(); });
  wrap.append(top, input);
  ui[key] = { input, refresh };
  return wrap;
}
function colorCtl(key, label, onChange) {
  const row = document.createElement('div'); row.className = 'row';
  const lab = document.createElement('label'); lab.textContent = label;
  const input = document.createElement('input'); input.type = 'color'; input.value = S[key];
  input.addEventListener('input', () => { S[key] = input.value; onChange && onChange(S[key]); clearPresetActive(); });
  row.append(lab, input);
  ui[key] = { input, refresh: () => {} };
  return row;
}
function toggle(key, label, onChange) {
  const row = document.createElement('div'); row.className = 'row';
  const lab = document.createElement('label'); lab.textContent = label;
  const sw = document.createElement('span'); sw.className = 'switch';
  const input = document.createElement('input'); input.type = 'checkbox'; input.checked = S[key];
  const i = document.createElement('i');
  sw.append(input, i);
  input.addEventListener('change', () => { S[key] = input.checked; onChange && onChange(S[key]); clearPresetActive(); });
  row.append(lab, sw);
  ui[key] = { input, refresh: () => {} };
  return row;
}
function textCtl(key, onChange) {
  const input = document.createElement('input'); input.type = 'text'; input.value = S[key]; input.maxLength = 24; input.spellcheck = false;
  input.addEventListener('input', () => { S[key] = input.value; onChange && onChange(S[key]); clearPresetActive(); });
  ui[key] = { input, refresh: () => {} };
  return input;
}
function segCtl(key, opts, onChange) {
  const seg = document.createElement('div'); seg.className = 'seg';
  const btns = opts.map(o => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = o[1];
    b.addEventListener('click', () => { S[key] = o[0]; refresh(); onChange && onChange(S[key]); clearPresetActive(); });
    seg.appendChild(b); return [o[0], b];
  });
  const refresh = () => btns.forEach(([v, b]) => b.classList.toggle('active', S[key] === v));
  refresh();
  ui[key] = { input: null, refresh };
  return seg;
}
function group(title, items, open = true) {
  const det = document.createElement('details'); det.open = open;
  const sum = document.createElement('summary'); sum.textContent = title;
  const grp = document.createElement('div'); grp.className = 'grp';
  items.forEach(i => grp.appendChild(i));
  det.append(sum, grp);
  groupsEl.appendChild(det);
}

group('Word', [
  textCtl('text', scheduleBuild),
  slider('weight', 'Weight', 400, 900, 100, v => String(v), scheduleBuild),
  slider('tracking', 'Tracking', -0.12, 0.2, 0.01, v => (+v).toFixed(2) + 'em', scheduleBuild),
  toggle('caps', 'Uppercase', scheduleBuild),
  slider('width', 'Width', 0.4, 0.98, 0.01, v => Math.round(v * 100) + '%', layout),
]);
group('Grid', [
  slider('cols', 'Resolution', 60, 400, 2, v => String(v) + ' cols', scheduleBuild),
  slider('fill', 'Cell fill', 0.3, 1, 0.01),
  segCtl('shape', [['square', 'SQUARE'], ['dot', 'DOT'], ['diamond', 'DIAMOND']]),
  slider('threshold', 'Edge threshold', 20, 220, 5, v => String(v), scheduleBuild),
]);
group('Air', [
  slider('reach', 'Reach', 0.05, 0.8, 0.01),
  slider('push', 'Push', 0, 0.15, 0.001),
  slider('lift', 'Lift', 0, 0.08, 0.001),
  slider('drift', 'Turbulence', 0, 0.08, 0.001),
  slider('shrink', 'Shrink', 0, 1, 0.01),
  slider('ease', 'Easing', 0.01, 0.3, 0.005),
  slider('follow', 'Cursor follow', 0.02, 0.5, 0.01),
]);
group('Colour', [
  colorCtl('bgColor', 'Background', applyColors),
  colorCtl('inkColor', 'Ink'),
]);
group('Motion', [
  toggle('autoSweep', 'Auto sweep (idle)'),
  slider('sweepSpeed', 'Sweep speed', 0.05, 1.5, 0.05),
], false);

/* presets */
const presetsEl = document.getElementById('presets');
function clearPresetActive() { activePreset = null; [...presetsEl.children].forEach(b => b.classList.remove('active')); }
function applyPreset(name) {
  Object.assign(S, PRESETS[name]);
  activePreset = name;
  for (const k in ui) {
    const u = ui[k]; if (!u) continue;
    if (u.input) { if (u.input.type === 'checkbox') u.input.checked = S[k]; else u.input.value = S[k]; }
    u.refresh(S[k]);
  }
  [...presetsEl.children].forEach(b => b.classList.toggle('active', b.textContent === name));
  applyColors(); buildGrid();
}
Object.keys(PRESETS).forEach(name => {
  const b = document.createElement('button'); b.textContent = name;
  b.addEventListener('click', () => applyPreset(name));
  presetsEl.appendChild(b);
});

/* panel chrome */
const panel = document.getElementById('panel');
document.getElementById('hideUi').addEventListener('click', () => { panel.classList.add('hidden'); layout(); });
document.getElementById('toggleUi').addEventListener('click', () => { panel.classList.remove('hidden'); layout(); });
const toast = document.getElementById('toast');
document.getElementById('copyBtn').addEventListener('click', async () => {
  const out = { preset: activePreset, ...S };
  try { await navigator.clipboard.writeText(JSON.stringify(out, null, 2)); toast.textContent = 'Copied to clipboard'; }
  catch (e) { toast.textContent = 'Clipboard blocked — see console'; console.log(JSON.stringify(out, null, 2)); }
  toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1600);
});

/* ============================== boot ============================== */
applyPreset('Oxigen');
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('800 100px "Archivo"'), document.fonts.load('900 100px "Archivo"'), document.fonts.load('700 100px "Archivo"')])
    .then(buildGrid).catch(buildGrid);
  document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', buildGrid);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
